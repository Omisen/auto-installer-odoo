# =============================================================================
# .github/workflows/test.yml
# CI del port Rust dell'installer Odoo.
#
# Verifica formattazione, lint, build e test ad ogni push/PR.
# I test girano SENZA root: il sistema è modellato via il confine SystemOps
# (mock), quindi non servono privilegi né servizi esterni nel runner.
# =============================================================================

name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# Permessi minimi: la CI legge soltanto il codice.
permissions:
  contents: read

# Annulla run precedenti ancora in corso sullo stesso ref (risparmia minuti CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: build & test
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2

      # Ordine dal più veloce a fallire al più lento, così il feedback è rapido.
      - name: Formattazione (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lint (clippy, warning = errore)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (senza root, sistema mockato)
        run: cargo test --locked

      - name: Build release (verifica che il binario compili)
        run: cargo build --release --locked
