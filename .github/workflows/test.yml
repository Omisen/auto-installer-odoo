# =============================================================================
# the fast CI: formatting, lint, build and tests on every push and PR.
#
# the tests run WITHOUT root: the system is modelled behind the SystemOps
# boundary, so no privileges and no external services are needed.
# =============================================================================

name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# least privilege: this workflow only reads the code.
permissions:
  contents: read

# cancel superseded runs on the same ref, to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: build & test
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      # ordered fastest-to-fail first, so feedback comes quickly.
      - name: Formatting (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (no root, mocked system)
        run: cargo test --locked

      - name: Release build (checks the binary compiles)
        run: cargo build --release --locked

      # the crate is on crates.io, so **docs.rs publishes this documentation at
      # every release whether we look after it or not** — and a broken intra-doc
      # link is a page that sends a reader nowhere.
      #
      # this is deliberately the cheap half of the docs.rs question. It keeps the
      # published page from being *wrong*; it does not adopt docs.rs as a
      # documentation channel, which would mean a third place describing the same
      # invariants next to the wiki, with no CI able to tell when they diverge
      # (A-V3-20: documentation is the one part of this project that ages without
      # producing a red).
      #
      # it belongs to the FAST workflow because it costs seconds and catches the
      # mistake at the moment it is written — the alternative is finding it on a
      # published page, where it is already in front of whoever it misleads.
      - name: Documentation (intra-doc links must resolve)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --lib --locked

      # the CI scripts read the installer's log format, and a pattern that does
      # not match is not an error: it is zero results, which in a cleanliness
      # check looks like a passing verification. a second here; a whole round in
      # the real integration.
      - name: Self-test of the CI scripts (journal reading)
        run: bash scripts/ci/selftest-journal.sh

      - name: Syntax of the CI scripts
        run: |
          for f in scripts/ci/*.sh; do
            bash -n "$f" || exit 1
          done
