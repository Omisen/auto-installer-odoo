# =============================================================================
# .github/workflows/test.yml
# CI del port Rust dell'installer Odoo.
#
# Verifica formattazione, lint, build e test ad ogni push/PR.
# I test girano SENZA root: il sistema è modellato via il confine SystemOps
# (mock), quindi non servono privilegi né servizi esterni nel runner.
# =============================================================================

name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2

      - name: Formattazione (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lint (clippy, warning = errore)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Test (senza root, sistema mockato)
        run: cargo test
