# =============================================================================
# the fast CI: formatting, lint, build and tests on every push and PR.
#
# the tests run WITHOUT root: the system is modelled behind the SystemOps
# boundary, so no privileges and no external services are needed.
# =============================================================================

name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# least privilege: this workflow only reads the code.
permissions:
  contents: read

# cancel superseded runs on the same ref, to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: build & test
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2

      # ordered fastest-to-fail first, so feedback comes quickly.
      - name: Formattazione (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lint (clippy, warning = errore)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (senza root, sistema mockato)
        run: cargo test --locked

      - name: Build release (verifica che il binario compili)
        run: cargo build --release --locked

      # the CI scripts read the installer's log format, and a pattern that does
      # not match is not an error: it is zero results, which in a cleanliness
      # check looks like a passing verification. a second here; a whole round in
      # the real integration.
      - name: Self-test degli script di CI (lettura del diario)
        run: bash scripts/ci/selftest-journal.sh

      - name: Sintassi degli script di CI
        run: |
          for f in scripts/ci/*.sh; do
            bash -n "$f" || exit 1
          done
