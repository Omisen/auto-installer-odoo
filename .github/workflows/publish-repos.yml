# =============================================================================
# .github/workflows/publish-repos.yml
# Pubblicazione dei repository apt e dnf su GitHub Pages, al PUBLISH di una
# release.
#
# Perché esiste. Fino a qui l'unico canale erano gli asset della release: si
# scarica a mano, si verifica lo sha256, si installa. Funziona, ma non aggiorna
# nessuno — chi ha installato la 2.4.0 non sa che è uscita la 2.5.0, e il README
# nomina le URL per intero, quindi un cliente rimasto indietro segue una guida
# che *funziona* (il file vecchio esiste ancora) e installa una versione
# superata senza che nulla lo segnali. Con un repository, la versione corrente
# la decide il repo e non una riga di documentazione che qualcuno deve
# ricordarsi di alzare.
#
# ## Il modello: il sito è DATO DERIVATO
#
# Pages è configurato con source = GitHub Actions, quindi ogni deploy sostituisce
# l'intero sito. Non c'è nessun branch a fare da memoria, ed è voluto: la fonte
# di verità sono le GitHub Release, che questo workflow legge. Se il sito si
# corrompe, si rilancia il workflow e torna identico; nessun binario finisce in
# git.
#
# Il repository serve **solo l'ultima versione**. `apt`/`dnf search` mostrano
# comunque solo la più recente, quindi non si perde nulla nell'uso normale; si
# perde il downgrade via pacchetto, che resta possibile dalla pagina Releases —
# ed è dichiarato nel README, non lasciato intendere.
#
# ## La firma sta sui METADATI, non sui pacchetti
#
# I `.deb`/`.rpm` serviti qui sono gli stessi byte allegati alla release: non
# vengono rifirmati, perché un pacchetto rifirmato è un file diverso con lo
# stesso nome, e lo `.sha256` che il README pubblica diventerebbe falso. La
# catena di fiducia resta completa passando dai metadati firmati (è il modello
# di Debian, dove i `.deb` non sono mai firmati singolarmente). Il perché in
# dettaglio sta in scripts/ci/build-package-repos.sh.
#
# ## Cosa serve, una volta sola, a mano
#
#   1. Settings → Pages → Source: **GitHub Actions**
#   2. Secrets → Actions: `GPG_PRIVATE_KEY` (privata ASCII-armored) e
#      `GPG_PASSPHRASE`. La chiave PUBBLICA non è un secret: la esporta questo
#      workflow dalla privata, perché due copie della stessa chiave sono due
#      cose che possono divergere.
#   3. Settings → Environments → `github-pages` → **Deployment branches and
#      tags**: aggiungere una regola di tipo **Tag** con pattern `v*`.
#
#      Non è un dettaglio di configurazione: l'environment `github-pages` nasce
#      protetto e consente il deploy **solo dal branch di default**, mentre
#      questo workflow parte da `release: published`, dove il ref è il TAG. Senza
#      quella regola il job fa tutto — scarica, verifica i checksum, firma — e
#      viene respinto all'ultimo passo con «not allowed to deploy to github-pages
#      due to environment protection rules». La release resta pubblicata e il
#      repository apt/dnf no, che è il modo peggiore in cui questa cosa può
#      fallire: le istruzioni sono già online e puntano a un sito che non esiste.
#      (`workflow_dispatch` da `main` invece passa, perché lì il ref è un branch:
#      è la via d'uscita se la regola non si può cambiare.)
# =============================================================================

name: Publish repos

on:
  release:
    types: [published]
  # Ripubblicazione manuale: serve se un deploy fallisce, o dopo aver ruotato la
  # chiave. Senza tag riparte dall'ultima release.
  workflow_dispatch:
    inputs:
      tag:
        description: "tag da ripubblicare (vuoto = ultima release)"
        required: false
        type: string

permissions:
  contents: read # legge gli asset della release
  pages: write # pubblica il sito
  id-token: write # richiesto da deploy-pages

# Un solo deploy di Pages per volta, e NON si annulla quello in corso: un deploy
# interrotto a metà lascia il repository in uno stato che i client scaricano.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: apt + dnf → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Una prerelease non deve diventare il candidato di `apt install`: chi ha il
    # repository configurato si troverebbe una beta come aggiornamento.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      # La base URL ATTESA, cioè quella che il README promette agli utenti. Non
      # viene usata per costruire il sito (quella vera la dice `configure-pages`):
      # serve a confrontarle, più sotto.
      SITE_URL_ATTESA: https://omisen.github.io/invok

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # I secret PRIMA di tutto il resto: scoprire che manca la chiave dopo aver
      # scaricato e verificato i pacchetti è tempo buttato, e un fallback
      # silenzioso a "repo non firmato" sarebbe molto peggio di un errore.
      - name: I secret di firma ci sono
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mancanti=""
          [ -n "$GPG_PRIVATE_KEY" ] || mancanti="$mancanti GPG_PRIVATE_KEY"
          [ -n "$GPG_PASSPHRASE" ] || mancanti="$mancanti GPG_PASSPHRASE"
          if [ -n "$mancanti" ]; then
            echo "::error::secret mancanti:$mancanti — vedi l'intestazione di questo workflow"
            exit 1
          fi
          echo "✔ i due secret di firma sono presenti"

      # Il tag arriva da tre strade diverse; passa sempre da una variabile
      # d'ambiente e mai interpolato dentro lo script. Un `${{ }}` dentro `run:`
      # è concatenazione di testo nel sorgente della shell — la stessa classe di
      # problema per cui l'installer mette `--` prima di ogni nome posizionale.
      - name: Quale release pubblichiamo
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
          TAG_MANUALE: ${{ inputs.tag }}
        run: |
          if [ "$EVENTO" = "release" ]; then
            TAG="$TAG_RELEASE"
          elif [ -n "$TAG_MANUALE" ]; then
            TAG="$TAG_MANUALE"
          else
            TAG="$(gh release view --json tagName -q .tagName)"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::non riesco a determinare quale release pubblicare"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "versione=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "→ pubblico $TAG"

      # Guardia anti-retrocessione: ripubblicare una release VECCHIA farebbe
      # tornare indietro il repository, e i client lo vedrebbero come un
      # aggiornamento.
      #
      # Rifiuta SOLO se il latest è strettamente più recente. La formulazione
      # conta: subito dopo un publish l'API può essere in ritardo e restituire
      # ancora il tag precedente — un confronto "diverso da latest ⇒ rifiuto"
      # bloccherebbe l'unica esecuzione legittima, che è il danno certo contro un
      # danno ipotetico. Il caso da fermare è l'altro, e lì il latest è davvero
      # più recente.
      - name: Non si retrocede
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          LATEST="$(gh api "repos/$REPO/releases/latest" -q .tag_name 2>/dev/null || true)"
          if [ -z "$LATEST" ]; then
            echo "✔ nessuna release 'latest' nota: niente con cui confrontarsi"
            exit 0
          fi
          if [ "$LATEST" = "$TAG" ]; then
            echo "✔ $TAG è la release più recente"
            exit 0
          fi
          # `sort -V` ordina per versione, non per stringa: v2.10.0 viene dopo
          # v2.9.0, che con un confronto lessicografico sarebbe il contrario.
          PIU_RECENTE="$(printf '%s\n%s\n' "$TAG" "$LATEST" | sort -V | tail -1)"
          if [ "$PIU_RECENTE" = "$LATEST" ]; then
            echo "::error::$TAG è più vecchia di $LATEST: pubblicarla farebbe retrocedere il repository."
            echo "::error::Se è voluto, elimina o declassa $LATEST e rilancia."
            exit 1
          fi
          echo "✔ $TAG è più recente di $LATEST (l'API era indietro)"

      - name: Strumenti per costruire i due repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c

      - name: Scarica i pacchetti della release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p pkgs
          gh release download "$TAG" --dir pkgs \
            --pattern '*.deb' --pattern '*.rpm' \
            --pattern '*.deb.sha256' --pattern '*.rpm.sha256'
          ls -l pkgs

      # È questo passo a rendere «il repository serve esattamente i byte che il
      # README descrive» una proprietà verificata invece di una speranza: gli
      # stessi `.sha256` che documentiamo agli utenti vengono controllati qui.
      - name: Verifica i checksum pubblicati
        working-directory: pkgs
        run: |
          n="$(find . -maxdepth 1 -name '*.sha256' | wc -l)"
          if [ "$n" -ne 2 ]; then
            echo "::error::attesi 2 file .sha256 (deb e rpm), trovati $n"
            exit 1
          fi
          for f in *.sha256; do
            sha256sum -c "$f"
          done

      # Il nome dei pacchetti porta la versione, e la versione deve essere quella
      # del tag. Una riga, e intercetta una release assemblata male prima che
      # diventi il candidato di `apt install`.
      - name: Il tag e i pacchetti dicono la stessa versione
        env:
          VERSIONE: ${{ steps.rel.outputs.versione }}
        run: |
          deb="$(basename "$(find pkgs -maxdepth 1 -name '*.deb')")"
          rpm="$(basename "$(find pkgs -maxdepth 1 -name '*.rpm')")"
          errori=0
          case "$deb" in
            "invok_${VERSIONE}-"*"_amd64.deb") ;;
            *) echo "::error::$deb non corrisponde alla versione $VERSIONE del tag"; errori=1 ;;
          esac
          case "$rpm" in
            "invok-${VERSIONE}-"*".x86_64.rpm") ;;
            *) echo "::error::$rpm non corrisponde alla versione $VERSIONE del tag"; errori=1 ;;
          esac
          [ "$errori" -eq 0 ] || exit 1
          echo "✔ $deb e $rpm sono la versione $VERSIONE"

      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v5

      # La base URL con cui si costruisce il sito viene da Pages, non da noi: è
      # la fonte di verità. Ma il README ne promette una agli utenti, e le due
      # devono coincidere — un sito servito a un indirizzo diverso da quello
      # documentato non dà errore, dà 404 a chi segue la guida.
      - name: L'indirizzo pubblicato è quello che il README promette
        env:
          REALE: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "${REALE%/}" != "${SITE_URL_ATTESA%/}" ]; then
            echo "::error::Pages pubblica su '$REALE' ma il README documenta '$SITE_URL_ATTESA'"
            exit 1
          fi
          echo "✔ $REALE"

      - name: Importa la chiave di firma
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$FPR" ]; then
            echo "::error::nessuna chiave segreta importata: GPG_PRIVATE_KEY non è una chiave privata ASCII-armored?"
            exit 1
          fi
          {
            echo "gnupghome=$GNUPGHOME"
            echo "fpr=$FPR"
            # A gruppi di quattro, com'è d'uso confrontarli a occhio.
            echo "fpr_leggibile=$(printf '%s' "$FPR" | sed 's/..../& /g; s/ $//')"
          } >> "$GITHUB_OUTPUT"
          echo "✔ chiave $FPR"

      - name: Costruisci i due repository
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          FPR: ${{ steps.gpg.outputs.fpr_leggibile }}
        run: scripts/ci/build-package-repos.sh pkgs site "$BASE_URL" "$FPR"

      # Firma dei soli metadati. `InRelease` (testo + firma nello stesso file) è
      # ciò che apt preferisce; `Release.gpg` (firma staccata) resta per i client
      # più vecchi. Per dnf, la firma staccata di repomd.xml.
      - name: Firma i metadati ed esporta la chiave pubblica
        env:
          GNUPGHOME: ${{ steps.gpg.outputs.gnupghome }}
          FPR: ${{ steps.gpg.outputs.fpr }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          firma() { gpg --batch --yes --pinentry-mode loopback \
                        --passphrase "$GPG_PASSPHRASE" --local-user "$FPR" "$@"; }

          firma --clearsign          -o site/apt/InRelease   site/apt/Release
          firma --detach-sign --armor -o site/apt/Release.gpg site/apt/Release
          firma --detach-sign --armor -o site/rpm/repodata/repomd.xml.asc \
                                         site/rpm/repodata/repomd.xml

          gpg --batch --yes --armor --export "$FPR" > site/KEY.asc

          # Rileggere ciò che si è appena scritto: una firma prodotta ma non
          # verificabile è indistinguibile da nessuna firma, e il primo a
          # scoprirlo sarebbe `apt update` su una macchina di un cliente.
          gpg --verify site/apt/InRelease
          gpg --verify site/apt/Release.gpg site/apt/Release
          gpg --verify site/rpm/repodata/repomd.xml.asc site/rpm/repodata/repomd.xml
          echo "✔ tre firme prodotte e verificate"

      - name: Riepilogo di ciò che viene pubblicato
        run: |
          find site -type f | sort | sed 's/^/  /'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy su Pages
        id: deploy
        uses: actions/deploy-pages@v4
