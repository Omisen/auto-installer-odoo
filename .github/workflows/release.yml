# =============================================================================
# releases, with precompiled LINUX binaries.
#
# on a version tag, builds the installer for two x86_64 Linux targets and
# attaches the archives and their checksums to the GitHub release, so customers
# download a ready executable without having Rust: one file, run it, done.
#
#   x86_64-unknown-linux-gnu   standard glibc, for most servers
#   x86_64-unknown-linux-musl  STATIC, runs on any distribution
#
# the installer is Linux-only by nature, so there is no sensible Windows or macOS
# target. quality CI (formatting, lint, build, tests) stays in test.yml; only
# artifacts are produced here, on a tag. tag commits that are already green.
#
# HOW A RELEASE IS MADE, and why this file looks like this.
#
# the release and its tag are created by a HUMAN from the web UI: open a draft,
# write the new tag in it with `main` as target, press Publish. the tag does NOT
# exist until then — it is born at that moment. that single gesture fires TWO
# events together:
#
#   tag push          -> the artifacts are BUILT and attached to the release
#   release published -> the crate goes to the registry. IRREVERSIBLE: nothing
#                        is deleted there, only yanked
#
# every job declares WHICH of the two it belongs to with an `if` on the event
# name. without that line GitHub runs them ALL on BOTH events. a test demands it
# per job, because it is a line one forgets to add to the NEXT job and the
# symptom would arrive only on release day.
#
# THERE IS NO JOB THAT CREATES THE RELEASE, and that is a deliberate removal:
# there was one, written for the opposite flow — push the tag from the CLI, let
# CI prepare the draft. with the real flow the two fought: publishing created the
# tag, that job started and put the release BACK INTO DRAFT; republishing fired
# the second event and re-ran the publish on a version already uploaded, giving a
# red job on a publication that had succeeded the first time. a job that creates
# what the user already created is not redundant: it is an antagonist.
#
# declared consequence: the assets appear a few minutes AFTER the release is
# visible, and the "the README names this file" check runs with the release
# already public. that is the SECOND level of the guard, not the first: the first
# is `cargo test`, composing the expected names from the manifest on every push,
# long before the tag (A-V3-17).
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  release:
    types: [published]

permissions:
  contents: write # needed to upload the release assets

jobs:
  # builds and uploads one archive per target; the action handles the cross build
  # and produces the archive plus its checksum file.
  #
  # no `needs`: the release already exists when this job starts — publishing it is
  # what created the tag that woke us. there is nothing to wait for.
  upload-assets:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: invok
          target: ${{ matrix.target }}
          # a clear name: invok-<target>.tar.gz
          archive: $bin-$target
          checksum: sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the native .deb, ALONGSIDE the tarballs and not replacing them: for whoever
  # wants the command in their PATH rather than a bare binary.
  #
  # it packages the TOOL, not Odoo: only the binary and its docs. no service, no
  # user, no dependency on the database or the proxy — the installer creates
  # those at runtime. built from the static musl binary, so it runs anywhere.
  deb:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2
      - name: Installa cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build release (musl, statico)
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Genera il .deb (senza ricompilare)
        run: cargo deb --no-build --target x86_64-unknown-linux-musl
      - name: Checksum SHA-256
        run: |
          deb="$(ls target/x86_64-unknown-linux-musl/debian/*.deb)"
          ( cd "$(dirname "$deb")" && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256" )
          echo "DEB=$deb" >> "$GITHUB_ENV"
      # A-V3-17: the README promises a filename in full, and nobody compared that
      # promise with the file actually produced. one release's package carried a
      # revision suffix the README's name lacked, so the install command gave a
      # 404 — and the unit test could not notice, because it repeated the same
      # conjecture.
      #
      # here the name is NOT conjectured: it is the basename of the artifact
      # about to be published, the only point in the chain where this check can
      # say no for the right reason. and it says so BEFORE the upload, because a
      # release published with a wrong README is fixed only by another release.
      - name: Il README nomina questo file
        run: |
          nome="$(basename "$DEB")"
          if ! grep -qF "$nome" README.md; then
            echo "::error::il README non nomina '$nome': i comandi di installazione darebbero 404"
            grep -n 'amd64\.deb' README.md || true
            exit 1
          fi
          echo "✔ il README nomina $nome"
      - name: Carica .deb + checksum sulla Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$DEB" "$DEB.sha256" --clobber

  # the .rpm, for the other family: the same promise as the .deb — it packages
  # the TOOL, not Odoo.
  #
  # no declared dependency: the binary is static, and it is the **same artifact**
  # that goes into the .deb and the tarball. one binary, three wrappers.
  rpm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2
      - name: Installa cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release (musl, statico)
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Genera il .rpm (senza ricompilare)
        run: cargo generate-rpm --target x86_64-unknown-linux-musl
      - name: Checksum SHA-256
        run: |
          rpm="$(ls target/x86_64-unknown-linux-musl/generate-rpm/*.rpm)"
          ( cd "$(dirname "$rpm")" && sha256sum "$(basename "$rpm")" > "$(basename "$rpm").sha256" )
          echo "RPM=$rpm" >> "$GITHUB_ENV"
      # as for the .deb (A-V3-17): the name comes from the artifact, not from us.
      # here the README happened to be right by luck and not by verification —
      # the revision was there because somebody had copied it from the previous
      # release. luck and checking look alike until something changes.
      - name: Il README nomina questo file
        run: |
          nome="$(basename "$RPM")"
          if ! grep -qF "$nome" README.md; then
            echo "::error::il README non nomina '$nome': i comandi di installazione darebbero 404"
            grep -n 'x86_64\.rpm' README.md || true
            exit 1
          fi
          echo "✔ il README nomina $nome"
      - name: Carica .rpm + checksum sulla Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$RPM" "$RPM.sha256" --clobber

  # publishing to the registry — the fourth wrapper of the same program, with the
  # difference that governs this whole job: **it is the only irreversible one.**
  # a release asset can be deleted; a published version cannot. it can only be
  # yanked, which hides it from whoever has not requested it yet, and the crate's
  # NAME stays taken forever.
  #
  # hence three cautions, in the order they act:
  #   1. the trigger is the publication, not the tag: we publish when a human has
  #      looked at the draft and published it, not when a CI starts;
  #   2. a PRERELEASE does not reach the registry. it has no draft concept, so a
  #      beta there is indistinguishable from a stable one to anyone installing;
  #   3. a dry run BEFORE the real publish: it packages and compiles exactly as
  #      the publish would, uploading nothing. an incomplete manifest or an
  #      out-of-spec keyword falls there, where it costs a red job instead of
  #      landing mid-upload.
  crates-io:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # narrows the write permission declared at the top: this job does not touch
    # the repository, it uploads to an external registry. the only token it needs
    # is the registry's.
    permissions:
      contents: read
    steps:
      # the ref is EXPLICIT. on a release event the default checkout is not
      # guaranteed to be the tagged commit, and publishing to an irreversible
      # registry a tree other than the one reviewed and tagged is the worst way
      # to discover the difference.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2
      # the same philosophy as the tag-versus-version checks on the packages: the
      # number is not conjectured, it is read from both sources and compared.
      # here the direction is reversed — a tag against a manifest, not a composed
      # filename — and a mismatch is worse: a version published from the wrong
      # tag cannot be fixed by republishing, because that version is taken.
      #
      # the tag arrives through an environment variable and not through
      # interpolation inside the script: a value interpolated into a `run` body
      # is text that becomes shell, the class of defect this project has paid for
      # elsewhere.
      - name: La versione del manifesto è quella del tag
        id: manifesto
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          atteso="${TAG#v}"
          metadati="$(cargo metadata --no-deps --format-version 1)"
          nome="$(printf '%s' "$metadati" | jq -r '.packages[0].name')"
          reale="$(printf '%s' "$metadati" | jq -r '.packages[0].version')"
          if [ "$atteso" != "$reale" ]; then
            echo "::error::il tag dice '$atteso', Cargo.toml dice '$reale': su crates.io la versione non si corregge"
            exit 1
          fi
          echo "✔ tag e manifesto concordano: $nome $reale"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "versione=$reale" >> "$GITHUB_OUTPUT"

      # is this version ALREADY on the registry?
      #
      # the publication event can fire more than once for the same release, and
      # the second time the publish exits with `already exists`: a red job on a
      # publication that succeeded the first time. that only happens if something
      # puts the release back into draft and it is republished — the reason the
      # creating job no longer exists — but a repeated event is not under our
      # control, and a red that means nothing teaches people to ignore reds.
      #
      # skipping is safe because the step ABOVE has established that the
      # manifest's version is the tag's: if that version is on the registry it is
      # ours, and republishing it is impossible by definition. outside a clear
      # yes or no we do NOT guess: we proceed and let `cargo` have the last word,
      # since it refuses duplicates anyway. this guard can only turn a useless
      # red into an honest green — never authorise a publication that would not
      # otherwise happen.
      - name: È già su crates.io?
        id: registro
        env:
          NOME: ${{ steps.manifesto.outputs.nome }}
          VERSIONE: ${{ steps.manifesto.outputs.versione }}
        run: |
          codice="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: invok-release (https://github.com/Omisen/invok)" \
            "https://crates.io/api/v1/crates/$NOME/$VERSIONE" || echo 000)"
          case "$codice" in
            200)
              echo "salta=si" >> "$GITHUB_OUTPUT"
              echo "::notice::$NOME $VERSIONE è già su crates.io: niente da pubblicare."
              ;;
            404)
              echo "✔ $NOME $VERSIONE non è ancora sul registro: si procede."
              ;;
            *)
              echo "::warning::crates.io ha risposto $codice, che non so interpretare: decide cargo."
              ;;
          esac

      - name: cargo publish --dry-run
        if: steps.registro.outputs.salta != 'si'
        run: cargo publish --dry-run --locked
      - name: cargo publish
        if: steps.registro.outputs.salta != 'si'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

