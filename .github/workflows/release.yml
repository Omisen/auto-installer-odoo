# =============================================================================
# .github/workflows/release.yml
# Release automatica con binari LINUX precompilati.
#
# A ogni tag di versione (es. v2.1.0), builda l'installer in release per due
# target Linux x86_64 e allega gli archivi (+ checksum SHA-256) alla GitHub
# Release. Così clienti e stagisti scaricano un eseguibile pronto, senza avere
# Rust installato — "un file, lo lanci, funziona".
#
# Target:
#   - x86_64-unknown-linux-gnu   → standard (glibc), per la maggior parte dei server
#   - x86_64-unknown-linux-musl  → STATICO, gira su qualsiasi distro (consigliato ai clienti)
#
# Nota: l'installer è Linux-only per natura (useradd/apt/systemctl/sudo/nix): non
# esistono target Windows/macOS sensati. Solo binari Linux, ed è voluto.
#
# La CI di qualità (fmt/clippy/build/test) resta in test.yml, su push/PR.
# Qui si producono solo gli artefatti, su tag. Tagga commit già verdi.
#
# DUE EVENTI, DUE MOMENTI — e la distinzione è la cosa da non perdere di vista
# leggendo questo file:
#
#   push di un tag       → si COSTRUISCONO gli artefatti e si allegano a una
#                          release in BOZZA. Reversibile: se qualcosa è storto,
#                          si cancella la bozza e si ritagga.
#   release published    → si pubblica su crates.io. IRREVERSIBILE: dal registro
#                          non si cancella, si può solo `yank`. Perciò è agganciato
#                          alla pubblicazione manuale della bozza — lo stesso
#                          checkpoint umano che aveva il publish del repository
#                          apt/dnf prima di essere rimosso.
#
# Ogni job dichiara quindi a QUALE dei due eventi appartiene, con un
# `if: github.event_name == ...`. Non è una formalità: senza quella riga, alla
# pubblicazione della release ripartirebbero anche i job di build, e
# `create-gh-release-action` proverebbe a creare una release che esiste già.
# C'è un test che pretende la condizione su ogni job (`tests/ci_config.rs`),
# perché è una riga che si dimentica di aggiungere al prossimo job e il sintomo
# arriverebbe solo il giorno della release.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  release:
    types: [published]

permissions:
  contents: write # necessario per creare la Release e caricare gli asset

jobs:
  # Crea la GitHub Release dal tag. Bozza: gli asset vengono allegati ma la
  # release non è pubblica finché non la revisioni (incolli il changelog) e la
  # pubblichi manualmente.
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builda e carica un archivio per ogni target. L'action gestisce cross-build
  # (musl) e genera archivio .tar.gz + file .sha256 accanto ad esso.
  upload-assets:
    if: github.event_name == 'push'
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: invok
          target: ${{ matrix.target }}
          # Naming chiaro: invok-<target>.tar.gz
          archive: $bin-$target
          checksum: sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pacchetto .deb "nativo" per Debian/Ubuntu, ACCANTO ai tar.gz (non li
  # sostituisce). Chi vuole `apt install ./invok_x.y.z_amd64.deb` e il
  # comando nel PATH usa questo; chi vuole il binario nudo usa il tar.gz.
  #
  # Il .deb impacchetta il TOOL, non Odoo: deposita solo /usr/bin/invok
  # (+ doc). Nessun servizio, nessun utente, nessuna dipendenza su postgres/nginx
  # — quelle le crea l'installer a runtime. Buildato da musl statico, così gira
  # su qualsiasi distro.
  deb:
    if: github.event_name == 'push'
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2
      - name: Installa cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build release (musl, statico)
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Genera il .deb (senza ricompilare)
        run: cargo deb --no-build --target x86_64-unknown-linux-musl
      - name: Checksum SHA-256
        run: |
          deb="$(ls target/x86_64-unknown-linux-musl/debian/*.deb)"
          ( cd "$(dirname "$deb")" && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256" )
          echo "DEB=$deb" >> "$GITHUB_ENV"
      # A-V3-17: il README promette un nome di file per intero, e finora nessuno
      # confrontava quella promessa con il file davvero prodotto. Il `.deb` della
      # v2.3.0 si chiamava `..._2.3.0-1_amd64.deb` e il README ne nominava uno
      # senza `-1`: comando di installazione → 404, e il test unitario non poteva
      # accorgersene perché ripeteva la stessa congettura del README.
      #
      # Qui il nome NON è congetturato: è il basename dell'artefatto che stiamo
      # per pubblicare. È l'unico punto della catena in cui questo controllo può
      # dire di no per il motivo giusto — e lo dice PRIMA dell'upload, perché una
      # release pubblicata con il README sbagliato si corregge solo con un'altra
      # release.
      - name: Il README nomina questo file
        run: |
          nome="$(basename "$DEB")"
          if ! grep -qF "$nome" README.md; then
            echo "::error::il README non nomina '$nome': i comandi di installazione darebbero 404"
            grep -n 'amd64\.deb' README.md || true
            exit 1
          fi
          echo "✔ il README nomina $nome"
      - name: Carica .deb + checksum sulla Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$DEB" "$DEB.sha256" --clobber

  # Il .rpm, per la famiglia Fedora: stessa promessa del .deb — impacchetta il
  # TOOL, non Odoo. Chi vuole `dnf install ./invok-x.y.z.x86_64.rpm` e
  # il comando nel PATH usa questo.
  #
  # Nessuna dipendenza dichiarata: il binario è musl statico, ed è lo **stesso
  # artefatto** che finisce nel .deb e nel tar.gz. Un solo binario, tre
  # confezioni.
  rpm:
    if: github.event_name == 'push'
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2
      - name: Installa cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release (musl, statico)
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Genera il .rpm (senza ricompilare)
        run: cargo generate-rpm --target x86_64-unknown-linux-musl
      - name: Checksum SHA-256
        run: |
          rpm="$(ls target/x86_64-unknown-linux-musl/generate-rpm/*.rpm)"
          ( cd "$(dirname "$rpm")" && sha256sum "$(basename "$rpm")" > "$(basename "$rpm").sha256" )
          echo "RPM=$rpm" >> "$GITHUB_ENV"
      # Come per il `.deb` (A-V3-17): il nome viene dall'artefatto, non da noi.
      # Sul `.rpm` il README era già giusto per fortuna, non per verifica — la
      # revisione `-1` c'era perché qualcuno l'aveva copiata guardando la release
      # precedente. Fortuna e controllo si distinguono solo quando cambia
      # qualcosa.
      - name: Il README nomina questo file
        run: |
          nome="$(basename "$RPM")"
          if ! grep -qF "$nome" README.md; then
            echo "::error::il README non nomina '$nome': i comandi di installazione darebbero 404"
            grep -n 'x86_64\.rpm' README.md || true
            exit 1
          fi
          echo "✔ il README nomina $nome"
      - name: Carica .rpm + checksum sulla Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$RPM" "$RPM.sha256" --clobber

  # Pubblicazione su crates.io — `cargo install invok` per chi ha già Rust.
  # Quarta confezione dello stesso programma, con una differenza che governa
  # tutto il resto di questo job: **è l'unica irreversibile.** Da una GitHub
  # Release si cancella un asset; da crates.io no. Si può solo `yank`, che
  # nasconde la versione a chi non l'ha ancora richiesta ma non la rimuove, e il
  # NOME del crate resta preso per sempre.
  #
  # Da qui le tre cautele, in ordine di quando intervengono:
  #   1. l'aggancio è `release: published`, non il tag: si pubblica quando un
  #      umano ha guardato la bozza e l'ha pubblicata, non quando parte una CI;
  #   2. una PRERELEASE non arriva su crates.io. Il registro non ha il concetto
  #      di bozza, quindi una beta pubblicata lì è indistinguibile da una stabile
  #      per chiunque faccia `cargo install invok`;
  #   3. `--dry-run` PRIMA del publish vero: impacchetta e compila esattamente
  #      come farebbe il publish, ma senza caricare nulla. Un manifesto
  #      incompleto o una keyword fuori norma cadono lì, dove costa un job rosso,
  #      invece che a metà upload.
  crates-io:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Restringe il default `contents: write` dichiarato in cima: questo job non
    # tocca il repository, carica su un registro esterno. Il token che gli
    # interessa è CARGO_REGISTRY_TOKEN, e non c'è motivo che abbia anche i
    # permessi di scrittura sui contenuti.
    permissions:
      contents: read
    steps:
      # Il ref è ESPLICITO. Su un evento `release`, il checkout di default non
      # è garantito essere il commit taggato, e pubblicare su un registro
      # irreversibile un albero diverso da quello che è stato revisionato e
      # taggato è il modo peggiore di scoprire la differenza.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2
      # Stessa filosofia dei controlli "tag ↔ versione" già presenti sul .deb e
      # sul .rpm: il numero non si congettura, si legge dalle due fonti e si
      # confrontano. Qui però il verso è invertito rispetto a quei due — non
      # componiamo un nome di file, confrontiamo un tag con un manifesto — e il
      # danno di uno scarto è più grave: `invok 3.0.0` su crates.io costruito
      # dal tag `v3.1.0` non si corregge ripubblicando, perché quella versione
      # è occupata.
      #
      # Il tag passa da una variabile d'ambiente e non da `${{ }}` dentro lo
      # script: un valore interpolato nel corpo di un `run` è testo che diventa
      # shell, ed è la classe di difetti che questo progetto ha già pagato
      # altrove (mai `source`/`eval` su dati che vengono da fuori).
      - name: La versione del manifesto è quella del tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          atteso="${TAG#v}"
          reale="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$atteso" != "$reale" ]; then
            echo "::error::il tag dice '$atteso', Cargo.toml dice '$reale': su crates.io la versione non si corregge"
            exit 1
          fi
          echo "✔ tag e manifesto concordano: $reale"
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

