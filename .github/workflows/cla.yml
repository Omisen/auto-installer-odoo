# =============================================================================
# the CLA gate: an external contributor signs before their pull request can be
# merged.
#
# the signature is a comment on the pull request carrying an exact phrase. the
# action records it in `signatures/version1/cla.json` ON THIS REPOSITORY, on the
# default branch, which is why the job needs `contents: write` — there is no
# external service and no personal token: the built-in `GITHUB_TOKEN` is enough
# because the store lives here.
#
# `signatures/version1/cla.json` is NOT created by hand: the action creates it
# with the first signature. a file placed there beforehand makes the run fail.
#
# `pull_request_target` runs in the context of the BASE repository, so the token
# it gets is privileged — this is what lets a fork's pull request be commented
# on and labelled. it also means this workflow must never check out or execute
# code from the pull request head. it does not: the action needs no checkout.
#
# no `concurrency` group on purpose. cancelling a superseded run is right for a
# test workflow and wrong here: a run cancelled between "record the signature"
# and "commit the file" would lose it.
# =============================================================================

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# least privilege by default; the job below widens what it actually needs.
permissions:
  contents: read

jobs:
  cla:
    name: check or record the signature
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # commits the signature file
      pull-requests: write # comments on the pull request
      statuses: write # sets the CLA status check
      actions: write # re-runs the blocked workflow after signing

    steps:
      # the guard keeps the job from running on every unrelated comment: only
      # the sign phrase, an explicit `recheck`, and pull request events.
      - name: CLA Assistant
        if: >
          (github.event_name == 'issue_comment' &&
            (github.event.comment.body == 'recheck' ||
             github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
          github.event_name == 'pull_request_target'
        # pinned to a released tag: the upstream repository is archived, so
        # `@master` is a branch nobody maintains any more, not a moving target
        # that improves.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # built in, issued per run, expires with it. no secret to create and
          # none to rotate.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Omisen/invok/blob/main/CLA.md'
          branch: 'main'
          # the maintainer and bots: a dependency bump does not sign anything.
          allowlist: Omisen,dependabot[bot],*[bot]
          # once merged, the pull request is locked so the signed thread cannot
          # be edited afterwards.
          lock-pullrequest-aftermerge: true
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, this project
            needs a signed Contributor License Agreement from everyone who
            contributed code to it. Please read the
            [CLA Document](https://github.com/Omisen/invok/blob/main/CLA.md) and,
            if you agree, post a new comment on this pull request containing
            exactly the sentence below.
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Thank you — the review can go
            ahead.
