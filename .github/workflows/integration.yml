# =============================================================================
# the REAL integration test: the installer is actually run.
#
# why it exists, in one line: mocks prove the *logic*, not the *integration with
# the system*. the first real VM session found two high-severity bugs in a single
# round — an install command that did not resolve dependencies, and a rollback
# purge that failed on a broken dpkg — with the whole mock suite green. this
# workflow automates that session.
#
# how it relates to the others:
#   test.yml     quality CI on mocks, without root, on EVERY push and PR. the
#                fast gate, and it stays UNCHANGED: the real test must not slow
#                the development cycle down.
#   release.yml  binaries on a tag. unchanged.
#   this one     slow (tens of minutes) and privileged. on request, and on the
#                main branches only.
#
# DESTRUCTIVE: it creates users, installs packages, touches PostgreSQL and
# systemd. it runs only on ephemeral runners and containers.
# =============================================================================

name: Integration (real install)

on:
  # manual dispatch: the normal way to validate a change before tagging a
  # release.
  workflow_dispatch:
  # main branches only, not every feature branch: several jobs of tens of
  # minutes each, and fast feedback is test.yml's job.
  push:
    branches: [main, dev]

permissions:
  contents: read

# one integration at a time per ref: long jobs on ephemeral runners, so
# cancelling the superseded one beats queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # the full test: real installation, Odoo answering, then the rollback and a
  # clean system.
  #
  # it runs on the **native** runners and not in a container, for a precise
  # reason: they are real VMs with systemd as PID 1. in a standard container the
  # service manager does not operate, and without it neither the service's start
  # nor its removal can be proved — half the lifecycle. the runners are
  # ephemeral: dirtying them is exactly what we want.
  # ---------------------------------------------------------------------------
  native:
    name: install + rollback (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # pip compiles gevent: that is the slow part
    strategy:
      fail-fast: false # one failing OS must not hide the others
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      # context for reading a failure: what was already on the machine. these
      # runners are NOT minimal, which makes this job also a test of the
      # "non-virgin customer machine" scenario — a small delta, and pre-existing
      # resources that must survive the rollback.
      # a hosted runner's package index is stale: the image is built days
      # earlier and nobody refreshes it at boot. since R6-hotfix the installer
      # refreshes it itself, so this step is **redundant for the product** — it
      # stays to make the test environment's state explicit and to move the
      # network cost out of the installation's clock.
      #
      # it must NOT mask the fix: the stale-index case is covered by mock tests,
      # which do not depend on how the runner is tuned.
      - name: Package index refreshed (explicit test environment)
        run: sudo apt-get update

      - name: Initial state of the machine
        run: |
          . /etc/os-release && echo "OS: $PRETTY_NAME"
          echo "PostgreSQL preinstalled: $(dpkg -s postgresql >/dev/null 2>&1 && echo yes || echo no)"
          echo "postgresql service: $(systemctl is-active postgresql || true)"
          echo "Port 8069: $(ss -lnt 'sport = :8069' | tail -n +2 | wc -l) listener(s)"

      - name: Real installation and verified rollback
        env:
          MODE: full
        run: bash scripts/ci/integration-test.sh

      # the log file. since A-V3-2 it lives outside the perimeter and no longer
      # depends on a directory the installer has yet to create, so it appears on
      # a **first** installation too — the case A-R5-2 left without a
      # post-mortem.
      - name: The installer's log, if any
        if: always()
        run: sudo cp /var/log/invok.log "installer-${{ matrix.os }}.log" || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-${{ matrix.os }}
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # the other three Odoo versions (A-V3-26).
  #
  # why it exists: `--version` accepts 16, 17, 18 and 19, the README promises all
  # four on its first page, and until 2026-08-16 **every** CI config installed
  # 18.0 — so three of the four were accepted by the parser and executed by
  # nobody. one of them did not install at all, and the report came from a
  # customer's machine. it is rule 7 of the multi-distro section applied to
  # versions: a family nobody runs is a promise, not a feature.
  #
  # THE AXIS IS `Odoo version × Python`, not `Odoo version × every image`. Python
  # comes from the distribution, and it is what the divergence actually rides on:
  # Odoo pins gevent, greenlet, lxml and the rest **per interpreter version**, so
  # Odoo 16 on 22.04 (3.10) and on 24.04 (3.12) are two genuinely different
  # tests, while Odoo 16 on Debian 12 and on Ubuntu 22.04 are nearly the same
  # one. hence six entries here which, with `native`'s two, make the complete
  # 4 × 2 grid and no duplicate — instead of the 4 × 6 that would be twenty-four
  # real installations per push. that is not a budget argument: a CI slow enough
  # to be worked around stops being evidence.
  #
  # 18.0 is deliberately NOT here. it is `native`'s job, which is the reference
  # cycle and carries the assertions this one does not repeat; duplicating it
  # would make the same failure appear twice under two names.
  #
  # one config file for every version, and the version passed as `--version`:
  # the CLI beats the `.env` by design, so there is no per-version copy of
  # `ci.env` to keep in step. `VER_SHORT` inside the script is DERIVED from that
  # same value and is not a second knob — see the comment there.
  # ---------------------------------------------------------------------------
  versions:
    name: install + rollback (Odoo ${{ matrix.odoo }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # pip compiles gevent: that is the slow part
    strategy:
      fail-fast: false # one failing version must not hide the others
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        odoo: ["16.0", "17.0", "19.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      # same reason as in `native`: the runner's index is as old as the image,
      # and this moves the network cost out of the installation's clock. the
      # installer refreshes it by itself since R6-hotfix, so this is redundant
      # for the product and deliberate for the test environment.
      - name: Package index refreshed (explicit test environment)
        run: sudo apt-get update

      # the pair under test, printed before anything runs: when this job fails,
      # the first question is which interpreter it was — and it is the axis, not
      # a detail.
      - name: The pair under test
        run: |
          . /etc/os-release && echo "OS: $PRETTY_NAME"
          echo "System Python: $(python3 --version)"
          echo "Odoo: ${{ matrix.odoo }}"

      - name: Real installation and verified rollback
        env:
          MODE: full
          ODOO_VERSION: ${{ matrix.odoo }}
        run: bash scripts/ci/integration-test.sh

      - name: The installer's log, if any
        if: always()
        run: sudo cp /var/log/invok.log "installer-odoo${{ matrix.odoo }}-${{ matrix.os }}.log" || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-odoo${{ matrix.odoo }}-${{ matrix.os }}
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # a static binary for the container jobs: it runs on any distribution, so one
  # executable serves every image without compiling Rust inside each. it is also
  # the binary the release recommends to customers, so testing it here means
  # testing the artifact we actually ship.
  # ---------------------------------------------------------------------------
  build-musl:
    name: static build (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Release build (musl, static)
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - uses: actions/upload-artifact@v4
        with:
          name: invok-musl
          path: target/x86_64-unknown-linux-musl/release/invok
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # the portability probe, in a container.
  #
  # declared limit: in a standard container the service manager exists as a
  # binary but does not operate, so the installation stops by construction at the
  # first step that needs a service. not a full lifecycle test — that is the
  # native job — but it covers exactly the surface the hosted runners cannot:
  #
  #   A5.1      package names on a different distribution, which change or
  #             disappear between releases. this is the job that found the
  #             problem and now verifies its fix: the list is groups of
  #             alternatives resolved at runtime, and here the group must resolve
  #             to the name that exists;
  #   A5.2      the codename-to-checksum-pin mapping, with the entries the hosted
  #             runners never exercise;
  #   A-RT-1/2  on genuinely minimal images, where the package's system
  #             dependencies are absent and dpkg can stay broken.
  #
  # and the part that matters most: whatever happens, the system must stay
  # clean.
  # ---------------------------------------------------------------------------
  container:
    name: portability probe (${{ matrix.image }})
    needs: build-musl
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:11"]
    container:
      image: ${{ matrix.image }}
      # the installer is launched through sudo by a normal user, as the caller
      # check demands; the steps then run as root.
      options: --user root

    steps:
      # the container is bare: sudo (the installer demands it), git (checkout),
      # jq (the assertions read the state file) and the systemd package, which
      # provides the binary the command check requires. the binary is there, the
      # init is not — the limit declared above.
      #
      # the index refresh here dates from day one (nothing installs without it),
      # and it is why these jobs passed while the hosted ones failed: A5.1-bis
      # showed only where nobody refreshed the index before the installer.
      - name: Container prerequisites
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo git ca-certificates curl jq systemd procps

      - name: A non-root user with sudo, as on a real machine
        run: |
          set -eux
          useradd -m -s /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          chmod 440 /etc/sudoers.d/tester

      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: invok-musl
          path: bin

      - name: Prepare the binary and the permissions
        run: |
          set -eux
          chmod +x bin/invok
          bin/invok --help >/dev/null
          # the workspace belongs to root: the installer runs as the unprivileged
          # user and must be able to read the config and the scripts.
          chown -R tester:tester "$GITHUB_WORKSPACE"

      - name: Portability probe (real installation and cleanup)
        run: |
          su tester -c "cd '$GITHUB_WORKSPACE' && MODE=probe BIN=./bin/invok bash scripts/ci/integration-test.sh"

      - name: The installer's log, if any
        if: always()
        run: |
          tag="$(echo '${{ matrix.image }}' | tr ':' '-')"
          cp /var/log/invok.log "installer-$tag.log" 2>/dev/null || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-${{ strategy.job-index }}
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # the other family: the full lifecycle, with systemd as PID 1.
  #
  # there are no hosted runners for it, and the container job above is not
  # enough — there the installation would stop by construction before the cluster
  # init, which is the riskiest divergence of the whole multi-distro work (M3).
  #
  # hence the choice: a container started by hand with the init as its command,
  # privileged and sharing the host's cgroups, so systemd really is PID 1 and the
  # install-service-rollback cycle becomes verifiable.
  #
  # **the base image does NOT contain systemd** — found on the first attempt,
  # which died on a missing init. the images are minimal, and the init is a
  # symlink the systemd package provides. so an intermediate image is built,
  # which is also the right place for the test's prerequisites.
  #
  # **if systemd does not come up**, the job fails explicitly instead of quietly
  # degrading to a probe: a job that passes without having tested what it exists
  # for is worse than no job (R7's lesson).
  # ---------------------------------------------------------------------------
  fedora:
    name: install + rollback (${{ matrix.image }}, ${{ matrix.scenario }})
    needs: build-musl
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # no entry tolerated in red: all of them block, which is what makes the
    # "newest tested" constant true (a test ties it to this matrix).
    strategy:
      fail-fast: false
      matrix:
        # two scenarios, not one. the nginx one is the only way to exercise this
        # family's firewall boundary: the tool is absent from the runners and the
        # development VM, so its operations have so far lived only on mocks —
        # the same situation as B-V3-7, and where defects survive here.
        #
        # the config is the same file the other job uses: a test guarantees it
        # differs from the base one in two keys only, so a red appearing only
        # here is attributable to nginx and nothing else.
        include:
          - image: "fedora:41"
            scenario: base
            env_file: configs/ci.env
            firewalld: "no"
          - image: "fedora:41"
            scenario: nginx
            env_file: configs/ci-nginx.env
            firewalld: "yes"
            # the scenario DECLARES it wants the firewall: inactive, the A-V3-7
            # checks would skip and the job would pass without testing what it
            # exists for. with this it stops and says so.
            fw_required: "1"
          # the release whose system Python the Odoo pins do not cover. blocking
          # since M11, and not out of optimism: it is the only matrix entry that
          # exercises the alternative-interpreter choice, while the other covers
          # the opposite branch — a system Python the pins do cover, nothing extra
          # to install. together they are the two branches of the decision.
          #
          # it was a probe tolerated in red while the question was open. the
          # answer exists now (on a real VM the whole requirements file installs
          # with the alternative interpreter), so a red here is a defect and must
          # stop everything: an expected red teaches people to ignore reds
          # (A-V3-10).
          - image: "fedora:44"
            scenario: base
            env_file: configs/ci.env
            firewalld: "no"
            fw_required: ""
          # the other Odoo versions on this family (A-V3-26, A-V3-28). the README
          # promises the distributions and the versions in two separate lists, so
          # their cross product is promised as surely as either — and a promise
          # nobody runs is the finding that started all this.
          #
          # ONE image and not both, because Fedora adds exactly **one** point on
          # the `version × Python` axis: 41 uses the system 3.13, and 44 has 3.14
          # so M11 picks `python3.13`. Both land on the same interpreter, and
          # which of them gets there is a question about the choice (already
          # covered by 18.0 above), not about the version. 41 is the one without
          # the alternative-interpreter machinery in between.
          #
          # 18.0 is not repeated here: it is the two entries above.
          #
          # **16.0 used to be deliberately absent here, and now it is the point
          # of this entry** (A-V3-29). What kept it out was true and is still
          # true: its newest gevent line is `>= '3.12'` with *nothing above it*,
          # so it pins 24.2.1 — whose newest wheel is cp312 — and past 3.12 pip
          # compiles and dies on `_PyLong_AsByteArray`, whose signature changed
          # in CPython 3.13.
          #
          # what changed is not Odoo: it is that the ceiling now knows **which
          # Odoo** it is deciding for. `choose_python` reads 3.12 for this branch
          # and 3.13 for the others, so on this image the venv is built on
          # `python3.12` — packaged by Fedora 41 through 44 — instead of on the
          # system 3.13.
          #
          # this entry is the difference between a feature and a promise (rule 7
          # of multi-distro), and it is **blocking** like every other: proven on
          # a real Fedora 44 before it was added — venv on 3.12.13, gevent
          # 24.2.1 from a wheel, HTTP 200, and a rollback that took the
          # interpreter back with the rest. 41 is the entry here because 44 is
          # the one already proven by hand; between them the family is covered.
          - image: "fedora:41"
            scenario: odoo16
            odoo: "16.0"
            env_file: configs/ci.env
            firewalld: "no"
            fw_required: ""
          - image: "fedora:41"
            scenario: odoo17
            odoo: "17.0"
            env_file: configs/ci.env
            firewalld: "no"
            fw_required: ""
          - image: "fedora:41"
            scenario: odoo19
            odoo: "19.0"
            env_file: configs/ci.env
            firewalld: "no"
            fw_required: ""
          # the PGDATA precondition (A-MD-6), which until now lived only on
          # mocks — the one piece of M12 no real execution had ever crossed.
          #
          # it needs a machine where PostgreSQL is **already installed** (so the
          # unit exists and systemd can be asked) and a drop-in moving PGDATA
          # somewhere else. Then the two answers to "where is the cluster"
          # diverge: the constant that drives our removal says
          # `/var/lib/pgsql/data`, the unit tells `postgresql-setup` otherwise —
          # and the installer must refuse **before** creating a cluster it would
          # later look for in the wrong place.
          #
          # this entry does not install anything, so it carries no `odoo` and no
          # `env_file` beyond the base one: what it exercises is a refusal.
          - image: "fedora:41"
            scenario: pgdata-conflict
            env_file: configs/ci.env
            firewalld: "no"
            fw_required: ""
            pgdata_conflict: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: invok-musl
          path: bin

      - name: An image with systemd and the test's prerequisites
        run: |
          set -eux
          # a QUOTED heredoc: unquoted, bash would interpret the continuation
          # backslashes and join the Dockerfile's lines. the matrix value is
          # substituted before bash sees the script, so the quoting costs it
          # nothing.
          cat > Dockerfile.ci <<'DOCKERFILE'
          FROM FEDORA_IMAGE
          # systemd: without it the init does not exist and the container does
          # not start. the others are prerequisites of the TEST and not of the
          # installer: sudo (which it demands), git (cloning), jq (the assertions
          # read the manifest) and the process tools.
          #
          # the firewall, its backend and the message bus: on a real machine of
          # this family the firewall is preinstalled, so having it in the image is
          # faithful and not a shortcut. it is STARTED only in the nginx scenario.
          # the bus is how the firewall client talks to its daemon: without either
          # one the daemon starts and then does not answer, the worst way to fail.
          #
          # the bus implementation matters, and it is the fix for a probe's red
          # (M7). the bus is **not only the firewall's**: the cluster init drops
          # root before asking systemd where the data directory is, and an
          # unprivileged query must go through the bus. without it those queries
          # fail and the script dies with a message that sends the reader to the
          # wrong option, far from the cause.
          #
          # the DEFAULT implementation is used and not the alternative: installing
          # the alternative with weak dependencies off left the image with the
          # package but no running bus. the nginx scenario had not noticed,
          # because starting the firewall pulls the bus in; the base scenario
          # never starts it, and that is where the probe died.
          #
          # the diff tools: without them the manifest's byte-for-byte comparison
          # (A-V3-1) cannot run — and an absent tool exits non-zero exactly like
          # one that finds a difference.
          #
          # the network tools, and this is not a detail: without them the port
          # preflight writes "no tool available: assuming free" and **cannot
          # fail**. this project's recurring signature, appearing in the test
          # environment instead of in the code: the refusal of a second
          # installation (A-R9-1) lives in the ORDER between the port check and
          # the manifest read, and without those tools the test cannot tell the
          # correct order from the broken one.
          RUN dnf -y install --setopt=install_weak_deps=False \
                systemd sudo git jq procps-ng iproute diffutils authselect \
                firewalld nftables dbus-broker \
           && dnf clean all
          # the bus socket is ENABLED by hand instead of trusting the preset: in
          # a container image presets are applied by packaging scriptlets, and
          # assuming they did is what left the probe without a bus. it is normally
          # already enabled or static, so it is touched only when reported
          # disabled.
          RUN systemctl enable dbus-broker.service \
           && { systemctl is-enabled dbus.socket >/dev/null 2>&1 \
                || systemctl enable dbus.socket ; }
          # units that make no sense in a container and would fail, leaving the
          # manager degraded for noise instead of for a real reason.
          RUN systemctl mask \
                systemd-remount-fs.service \
                dev-hugepages.mount \
                sys-fs-fuse-connections.mount \
                console-getty.service \
                getty.target
          # PAM in a container of this family: two things are missing.
          #
          # 1) the sudo stack includes a shared configuration that is a symlink
          #    managed by a profile tool. in a container image that tool was never
          #    initialised, so the link does not resolve: PAM finds no modules and
          #    account management fails with a message about not retrieving
          #    authentication info. the real cause of two previous rounds — and it
          #    was invisible from sudo's own configuration, which was correct.
          #
          #    a profile is applied; if the tool is unusable, a minimal
          #    configuration is written by hand. the existence test follows the
          #    symlink, so it answers false in exactly the case that matters:
          #    present but broken.
          RUN authselect select minimal --force 2>/dev/null \
           || authselect select local --force 2>/dev/null \
           || authselect select sssd --force 2>/dev/null \
           || true
          RUN test -e /etc/pam.d/system-auth || printf '%s\n' \
                'auth     sufficient pam_unix.so nullok' \
                'auth     required   pam_deny.so' \
                'account  required   pam_unix.so' \
                'password sufficient pam_unix.so' \
                'password required   pam_deny.so' \
                'session  required   pam_unix.so' \
                > /etc/pam.d/system-auth
          # 1b) even with that resolved, the Unix module keeps answering the
          #    same way in account management: it reads the shadow file and
          #    cannot.
          #
          #    here we stop chasing the cause and change the question. **sudo is
          #    the test's infrastructure, not its subject**: it launches the
          #    installer the way a person would, and its PAM chain is not what we
          #    are verifying. in a container image it is not reliably
          #    configurable — three attempts showed as much — so it is replaced
          #    with a permissive one.
          #
          #    **what is lost, declared**: this job no longer proves that sudo
          #    works on a real machine of this family. that proof exists elsewhere
          #    and is stronger — the manual VM installation, where sudo is the
          #    distribution's. the container covers what the VM cannot give:
          #    repeatability on every push.
          #
          #    the container is throwaway, privileged and without exposed
          #    networking: a permissive chain here opens nothing that privilege
          #    had not already opened.
          RUN printf '%s\n' \
                '#%PAM-1.0' \
                '# replaced in the CI container: see the comment in the workflow.' \
                'auth       sufficient   pam_permit.so' \
                'account    sufficient   pam_permit.so' \
                'session    optional     pam_keyinit.so revoke' \
                'session    required     pam_limits.so' \
                'session    sufficient   pam_permit.so' \
                > /etc/pam.d/sudo
          # 2) the lockout module wants its own state directory, which the
          #    tmpfiles service would create but not before PAM needs it.
          RUN mkdir -p /run/faillock /var/run/faillock
          CMD ["/usr/sbin/init"]
          DOCKERFILE
          sed -i "s|FEDORA_IMAGE|${{ matrix.image }}|" Dockerfile.ci
          cat Dockerfile.ci
          docker build -t invok-fedora:ci -f Dockerfile.ci .

      - name: Start the container with systemd as PID 1
        run: |
          set -eux
          chmod +x bin/invok
          docker run -d --name fedora-test \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            invok-fedora:ci

          # systemd takes a few seconds to settle. degraded is fine: in a
          # container some units do not start (and we do not need them), but the
          # service manager works — all the installer asks.
          for _ in $(seq 1 30); do
            state="$(docker exec fedora-test systemctl is-system-running 2>/dev/null || true)"
            case "$state" in running|degraded) break ;; esac
            sleep 2
          done

          state="$(docker exec fedora-test systemctl is-system-running 2>/dev/null || true)"
          echo "systemd: ${state:-unavailable}"
          case "$state" in
            running|degraded) ;;
            *)
              echo "::error::systemd did not settle in the container: without PID 1 this job would test less than it promises"
              docker logs fedora-test | tail -50
              exit 1
              ;;
          esac

      - name: A non-root user with sudo, as on a real machine
        run: |
          set -eux
          docker exec fedora-test useradd -m -s /bin/bash tester
          # a real password: creating the user alone leaves the account
          # **locked**, and under some PAM configurations a locked account fails
          # account management even with a passwordless sudo rule.
          docker exec fedora-test bash -c "echo 'tester:tester' | chpasswd"
          docker exec fedora-test bash -c "echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester"
          docker exec fedora-test chmod 440 /etc/sudoers.d/tester
          docker exec fedora-test mkdir -p /run/faillock
          docker exec fedora-test chown -R tester:tester /work

      # before launching half an hour of installation, the most trivial
      # prerequisite is checked. on the first round sudo failed on PAM and the
      # job noticed **afterwards**, from the installer's exit code: the diagnosis
      # was two steps away from the cause.
      #
      # when this fails, what is needed to understand it is printed.
      - name: Does sudo work? (a prerequisite, not the test's subject)
        run: |
          if docker exec -u tester fedora-test sudo -n true; then
            echo "sudo: ok"
            exit 0
          fi
          echo "::error::sudo does not work for the test user: the installer would not even start"
          docker exec fedora-test bash -c '
            echo "--- getent passwd tester ---"; getent passwd tester
            echo "--- shadow (presence only) ---"; grep -c "^tester:" /etc/shadow
            echo "--- sudoers.d ---"; ls -l /etc/sudoers.d/; cat /etc/sudoers.d/tester
            echo "--- pam.d/sudo ---"; cat /etc/pam.d/sudo
            echo "--- system-auth (prime suspect: the profile symlink) ---"
            ls -l /etc/pam.d/system-auth 2>&1
            readlink -f /etc/pam.d/system-auth 2>&1
            cat /etc/pam.d/system-auth 2>&1 | head -20
            echo "--- faillock ---"; ls -ld /run/faillock 2>&1
            echo "--- sudo setuid? (without it the module cannot read shadow) ---"
            ls -l /usr/bin/sudo 2>&1
            echo "--- nsswitch shadow/passwd ---"; grep -E "^(passwd|shadow):" /etc/nsswitch.conf 2>&1
            echo "--- sudo verbose ---"; su tester -c "sudo -n true" 2>&1 | tail -20
          ' || true
          exit 1

      # the second prerequisite, and why it is ASSERTED instead of assumed from
      # the image.
      #
      # the cluster init asks systemd where the data directory is **after**
      # dropping root, so the real question is not "is systemd PID 1?" but "can
      # an unprivileged user query systemd?" — which is what is asked here, in
      # the form in which it matters.
      #
      # the two diverge, and a probe (M7) fell exactly in their difference:
      # systemd was PID 1, the bus was not. the init tool's container fallback
      # did not save it, being gated on systemd NOT being PID 1: a container with
      # systemd but no bus falls in the hole between the two foreseen cases. the
      # symptom was a message about a missing data directory, sending the reader
      # to the wrong option while the cause was the bus.
      #
      # the same choice as the sudo check above: a prerequisite is verified where
      # it can be named, not discovered eight steps later disguised as an
      # installer error.
      #
      # querying a non-existent unit still exits zero (it prints the defaults), so
      # a failure here means **the bus** and not the unit — exactly what we want
      # to measure.
      - name: Does the system bus answer an unprivileged user?
        run: |
          if docker exec -u tester fedora-test systemctl show -p Environment dbus.service >/dev/null 2>&1; then
            echo "system bus: ok"
            exit 0
          fi
          echo "::error::the D-Bus system bus does not answer an unprivileged user: the cluster init would die with 'no db datadir (PGDATA) found', which is the wrong cause"
          docker exec fedora-test bash -c '
            echo "--- the bus socket ---"; ls -l /run/dbus/ 2>&1
            echo "--- the bus unit ---"
            systemctl is-enabled dbus.socket dbus-broker.service 2>&1
            systemctl is-active  dbus.socket dbus-broker.service 2>&1
            echo "--- status ---"; systemctl status dbus-broker.service --no-pager -l 2>&1 | head -30
            echo "--- journal ---"; journalctl -u dbus-broker.service -n 30 --no-pager 2>&1
            echo "--- does it work as root? (if so it is the bus, not systemd) ---"
            systemctl show -p Environment dbus.service 2>&1
          ' || true
          exit 1

      # the firewall ACTIVE, with the deliberate trap — the exact analogue of
      # what R17 did on the other family, for the same assertion: an already-open
      # similar rule CONTAINS the string of the one we want, so a substring
      # comparison would conclude port 80 is already open. the rule would not
      # enter the delta, the run would not open it, and nginx would stay
      # unreachable **with no error at all** (A-V3-7).
      #
      # the boundary reads the PERMANENT set, so the trap is set permanently and
      # reloaded: a runtime-only rule would vanish and the test would not ask
      # what production asks.
      - name: Firewall active, with 8080/tcp already open (the A-V3-7 trap)
        if: matrix.firewalld == 'yes'
        run: |
          set -eux
          docker exec fedora-test systemctl start firewalld || true

          for _ in $(seq 1 20); do
            if docker exec fedora-test firewall-cmd --state >/dev/null 2>&1; then break; fi
            sleep 2
          done

          # a firewall that does not come up must be SAID, not worked around: a
          # scenario that silently skipped those checks would promise coverage it
          # does not have — exactly the defect R7 found in the CI.
          if ! docker exec fedora-test firewall-cmd --state; then
            echo "::error::the firewall did not start in the container: the nginx scenario would not exercise it, which is the only reason it exists"
            docker exec fedora-test systemctl status firewalld --no-pager -l || true
            docker exec fedora-test journalctl -u firewalld -n 50 --no-pager || true
            exit 1
          fi

          docker exec fedora-test firewall-cmd --permanent --add-port=8080/tcp
          docker exec fedora-test firewall-cmd --reload
          docker exec fedora-test firewall-cmd --permanent --list-ports

      # the precondition's premise, built on purpose (A-MD-6).
      #
      # PostgreSQL installed FIRST, so the unit exists and systemd has something
      # to answer about: with no unit `systemctl show -p Environment` exits 0 with
      # an empty value, which the installer reads as "I do not know" and lets
      # through — blindness is not conflict, and that branch is the common one.
      # The conflict needs the other case.
      - name: PostgreSQL already installed, with PGDATA moved by a drop-in
        if: matrix.pgdata_conflict == 'yes'
        run: |
          set -eux
          docker exec fedora-test dnf install -y postgresql-server
          docker exec fedora-test mkdir -p /etc/systemd/system/postgresql.service.d
          docker exec fedora-test sh -c \
            'printf "[Service]\nEnvironment=PGDATA=/srv/pgdata\n" > /etc/systemd/system/postgresql.service.d/pgdata.conf'
          docker exec fedora-test systemctl daemon-reload
          # what systemd now reports is the input of the whole check: print it, so
          # a failure here is read as "the premise did not hold" and not as "the
          # installer did not refuse".
          docker exec fedora-test systemctl show -p Environment postgresql.service

      - name: The moved PGDATA is refused before a cluster is created
        if: matrix.pgdata_conflict == 'yes'
        run: |
          # NOT into the workspace: `/work` is this same directory bind-mounted
          # into the container, and an earlier step `chown -R tester` it — so the
          # runner cannot write here any more. The redirect failed before the
          # installer even ran, and the step died reporting nothing about its own
          # subject. `$RUNNER_TEMP` belongs to the runner and to nobody else.
          log="$RUNNER_TEMP/refuse.log"

          # `set +e` around it, exactly as the pre-existing-user job does: the
          # default shell runs with `-e`, so a refusal — which is the expected
          # outcome here — would abort the step before its own exit code could
          # be read.
          set +e
          docker exec -u tester -w /work fedora-test \
            sudo -n ./bin/invok --config configs/ci.env > "$log" 2>&1
          rc=$?
          set -e
          echo "exit code: $rc"; cat "$log"

          [ "$rc" -ne 0 ] || { echo "::error::the installation should have been refused"; exit 1; }

          # asserting the MESSAGE and not only the exit code, which is the whole
          # lesson of A-R9-1: when a check's value is in its *why*, a non-zero
          # exit proves nothing — this run could have failed for any of a dozen
          # other reasons and looked identical.
          grep -q "/srv/pgdata" "$log" \
            || { echo "::error::the message does not name the PGDATA this machine declares"; exit 1; }
          grep -q "/var/lib/pgsql/data" "$log" \
            || { echo "::error::the message does not name the one we know how to remove"; exit 1; }
          grep -q "postgresql.service" "$log" \
            || { echo "::error::the message does not say where the drop-in is to be removed"; exit 1; }

          # and it must have stopped BEFORE the cluster: this is a precondition,
          # not an undo, and the difference is a directory that either exists or
          # does not.
          docker exec fedora-test test ! -e /srv/pgdata \
            || { echo "::error::it created a cluster at the declared PGDATA"; exit 1; }
          [ -z "$(docker exec fedora-test ls -A /var/lib/pgsql/data)" ] \
            || { echo "::error::it initialised the default PGDATA anyway"; exit 1; }
          docker exec fedora-test test ! -d /opt/odoo \
            || { echo "::error::the steps before it were not rolled back"; exit 1; }
          docker exec fedora-test id odoo \
            && { echo "::error::the system user survived the rollback"; exit 1; } || true

          echo "✔ refused before initialising anything, naming both paths and the way out"

      - name: Real installation and rollback
        if: matrix.pgdata_conflict != 'yes'
        run: |
          docker exec -u tester -w /work fedora-test \
            env MODE=full BIN=./bin/invok \
                ENV_FILE='${{ matrix.env_file }}' \
                FW_REQUIRED='${{ matrix.fw_required }}' \
                ODOO_VERSION='${{ matrix.odoo }}' \
            bash scripts/ci/integration-test.sh

      # into `$RUNNER_TEMP`, and NOT into the workspace: `/work` is this directory
      # bind-mounted into the container, and the step that hands it to `tester`
      # chowns it — after which the runner cannot write here at all.
      #
      # this had been silently true for every Fedora job: the copy went to an
      # unwritable path, `2>/dev/null || true` swallowed the error, and
      # `if-no-files-found: ignore` swallowed the absence. So the whole family's
      # post-mortem artifact has never contained anything, and the two layers of
      # politeness are exactly what kept it invisible — R18's lesson, where a
      # failing job did not print `install.log` and the diagnosis became a guess
      # instead of a reading.
      #
      # a missing log is still not a failure (a job may legitimately never have
      # produced one), but it is now **said**.
      - name: The installer's log, if any
        if: always()
        run: |
          tag="$(echo '${{ matrix.image }}-${{ matrix.scenario }}' | tr ':' '-')"
          dest="$RUNNER_TEMP/installer-$tag.log"
          if docker cp "fedora-test:/var/log/invok.log" "$dest"; then
            echo "installer log saved: $(wc -l < "$dest") lines"
          else
            echo "::warning::no installer log could be copied out of the container"
          fi

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-fedora-${{ matrix.scenario }}
          path: ${{ runner.temp }}/installer-*.log
          if-no-files-found: ignore

      - name: Stop the container
        if: always()
        run: docker rm -f fedora-test || true

  # ---------------------------------------------------------------------------
  # the nginx phase, which no real run had ever touched (B-V3-7).
  #
  # the base config disables it, so those steps exited at the first condition in
  # every real installation ever done. the vhost was never written or validated,
  # the default site never removed or restored. two whole remediations lived only
  # on mocks.
  #
  # here defects have almost always been found by a real machine; the only nginx
  # defect ever surfaced came from an end-to-end test and not from a re-reading.
  # this job closes the last unobserved area.
  #
  # one OS only: the nginx phase has no differences between the two releases —
  # no conditional package name, no per-codename pin — so a second runner would
  # cost forty minutes to repeat the same assertions.
  # ---------------------------------------------------------------------------
  nginx:
    name: install + rollback with nginx (default site ${{ matrix.default_site }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # the TWO natures of the default site (A-V3-5). one install-and-rollback
      # cycle exercises a single one, and different branches handle them:
      #   symlink       removed and recreated towards the REGISTERED target;
      #   regular file  moved to a backup the undo puts back.
      # the second is the serious one — the audit's only point where customer
      # configuration is *lost* — and until this ran it was covered by mocks
      # alone. in a matrix the two go in parallel, so the wall clock is the
      # same.
      matrix:
        default_site: [symlink, regular-file]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package index refreshed (explicit test environment)
        run: sudo apt-get update

      # the default site must **really** be there: it is the third-party artifact
      # the rollback must restore (A-V3-5), and without it half the assertions
      # would have nothing to observe. nginx is preinstalled on the runners but
      # its configuration varies, so it is put into a known state.
      - name: nginx active with the default site (${{ matrix.default_site }})
        run: |
          sudo apt-get install -y nginx
          sudo rm -f /etc/nginx/sites-enabled/default

          if [ "${{ matrix.default_site }}" = "symlink" ]; then
            # the distribution's case: a link to the available default.
            sudo ln -sfn /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
          else
            # the data-losing case: an administrator who wrote the file directly
            # in the enabled directory. the existence check answered true here
            # too and the removal is a plain file removal, so the contents were
            # destroyed and the undo returned a symlink to the distro default.
            # the marker proves **that** file comes back.
            sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
            printf '\n# customer-marker-%s\n' "$GITHUB_RUN_ID" | sudo tee -a /etc/nginx/sites-enabled/default >/dev/null
            sudo sha256sum /etc/nginx/sites-enabled/default | sudo tee /tmp/default-site.sha256
          fi

          sudo systemctl restart nginx
          echo "default site:"; ls -l /etc/nginx/sites-enabled/

      # the firewall ACTIVE: the only way to exercise its step, which on a runner
      # always exits at once because the tool is installed but inactive — A-V3-7
      # had never been tested in the field.
      #
      # the extra rule is a **deliberate trap**: with the old substring
      # comparison the port we want looked present because it is contained in
      # that one, so it never entered the delta and was never opened. the symptom
      # would have been "Odoo does not answer", not an error.
      - name: Firewall active, with the 8080/tcp trap (A-V3-7)
        run: |
          sudo apt-get install -y ufw
          # rules first, then enable: forcing it on sets default-deny inbound,
          # and without these the runner would lock itself out.
          sudo ufw allow OpenSSH || sudo ufw allow 22/tcp
          sudo ufw allow 8080/tcp
          sudo ufw --force enable
          sudo ufw status verbose

      - name: Real installation and verified rollback (with nginx)
        env:
          MODE: full
          ENV_FILE: configs/ci-nginx.env
          # this job ENABLES the firewall itself in the previous step: finding it
          # inactive would not be a circumstance of the machine but a defect of
          # the job, and silently skipping the checks would leave A-V3-7 uncovered
          # in the very scenario written to exercise it.
          FW_REQUIRED: "1"
        run: bash scripts/ci/integration-test.sh

      # the customer's file must have come back **identical**, not "usually
      # right": the difference between restoring and replacing.
      - name: The regular default site came back byte for byte
        if: matrix.default_site == 'regular-file'
        run: |
          sudo test -f /etc/nginx/sites-enabled/default \
            || { echo "::error::the customer's file did not come back"; exit 1; }
          sudo test ! -L /etc/nginx/sites-enabled/default \
            || { echo "::error::it was a FILE and came back a symlink (A-V3-5)"; exit 1; }
          sudo sha256sum -c /tmp/default-site.sha256 \
            || { echo "::error::the contents changed: the customer's configuration was lost"; exit 1; }
          sudo grep -q "customer-marker" /etc/nginx/sites-enabled/default \
            || { echo "::error::the marker is gone: this is not the original file"; exit 1; }
          echo "✔ the customer's file came back identical"

      - name: The installer's log, if any
        if: always()
        run: sudo cp /var/log/invok.log "installer-nginx-${{ matrix.default_site }}.log" || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-nginx-${{ matrix.default_site }}
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # the system user already present on the machine (B-V3-7, closes A-V3-4).
  #
  # the finding's precondition, which the runners never had: R10's fix — the
  # first step handing the home to an already-existing user — had therefore never
  # really run.
  #
  # two scenarios, in this order, because the first leaves the system as the
  # second needs it after a single cleanup:
  #   1. user present, perimeter directory pre-existing and root-owned: the
  #      installation must REFUSE with an explicit precondition, before mutating;
  #   2. user present, directory absent: the installation succeeds and the home
  #      we create is handed over. the rollback removes it but **leaves the
  #      user**, who is not ours.
  # ---------------------------------------------------------------------------
  preexisting-user:
    name: pre-existing odoo user (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package index refreshed (explicit test environment)
        run: sudo apt-get update

      - name: User 'odoo' already present, with no home
        run: |
          sudo useradd --system --home-dir /opt/odoo --shell /bin/false odoo
          id odoo
          test ! -d /opt/odoo && echo "/opt/odoo does not exist: correct for scenario 2"

      # scenario 1: the home is there, root-owned, and not ours. we do not chown
      # it, and the installation must stop BEFORE mutating, saying why. without
      # this precondition the error arrived three steps later as a permission
      # denial.
      - name: Scenario 1 — pre-existing root-owned home, an explicit refusal
        run: |
          sudo mkdir -p /opt/odoo
          set +e
          sudo ./target/release/invok --config configs/ci.env > refuse.log 2>&1
          rc=$?
          set -e
          echo "exit code: $rc"; cat refuse.log

          [ "$rc" -ne 0 ] || { echo "::error::the installation should have been refused"; exit 1; }
          grep -q "/opt/odoo" refuse.log || { echo "::error::the message does not name the home"; exit 1; }
          grep -qi "root" refuse.log     || { echo "::error::the message does not say whose the home is"; exit 1; }
          grep -q "chown"  refuse.log    || { echo "::error::the message does not say what to do"; exit 1; }

          # a precondition, not an undo: no artifact was created.
          #
          # the manifest is NOT required to be absent: the precondition lives in
          # the second step's snapshot, and the first has already passed —
          # without mutating, the directory being pre-existing — and the engine
          # persisted that record. the file existing is correct; what counts is
          # that it describes nothing we created.
          [ -z "$(sudo ls -A /opt/odoo)" ] || { echo "::error::it mutated /opt/odoo before refusing"; exit 1; }
          test ! -d /opt/odoo/odoo18 || { echo "::error::it created the install dir"; exit 1; }
          test ! -f /etc/systemd/system/odoo18.service || { echo "::error::it installed the unit"; exit 1; }
          if sudo test -f /var/lib/invok/state.json; then
            if sudo grep -q '"CreatedByUs"' /var/lib/invok/state.json; then
              echo "::error::the manifest records artifacts we created: the precondition stopped nothing"
              sudo cat /var/lib/invok/state.json
              exit 1
            fi
            echo "  manifest present but with no artifacts of ours: correct"
          fi
          echo "✔ refused before mutating, with a message that says what to do"

          # the partial manifest is consumed with the intended command instead of
          # deleted by hand: otherwise scenario 2 would find it and start as a
          # **resume**, skipping the very step that must create and hand over the
          # home.
          sudo ./target/release/invok rollback --yes || true
          sudo rmdir /opt/odoo
          sudo test ! -e /var/lib/invok/state.json \
            || { echo "::error::the partial manifest was not consumed"; exit 1; }

      # scenario 2: we create the home, and it must be handed over at once to
      # the already-existing user, or a later step dies creating a directory as
      # them.
      - name: Scenario 2 — installation, home handover, rollback
        env:
          MODE: full
        run: bash scripts/ci/integration-test.sh

      # A-V3-4's specific check lives here and not in the script: the script
      # checks the final state, this checks that the pre-existing user survived a
      # rollback that removed everything else.
      - name: The pre-existing user survived
        run: |
          id odoo || { echo "::error::the rollback removed a user it had not created"; exit 1; }
          test ! -d /opt/odoo || { echo "::error::/opt/odoo should have gone: we created it"; exit 1; }
          echo "✔ the pre-existing user is intact, the home we created was removed"

      - name: The installer's log, if any
        if: always()
        run: sudo cp /var/log/invok.log installer-preexisting-user.log || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-preexisting-user
          path: installer-*.log
          if-no-files-found: ignore


  # ---------------------------------------------------------------------------
  # Two instances on one machine (phase I4).
  #
  # everything I0–I3 built lives here, and until this job nothing executed it on
  # a real machine: the derived names, the per-instance manifests, the shared
  # artifacts left alone, the widened root, the two pairs of ports. in this
  # project what nobody runs does not exist.
  #
  # the scenario is deliberately the CUSTOMER'S: an existing installation — the
  # historical, unnamed one — with a named instance added beside it. that is the
  # migration path, and it is where `A-V6-9` lived: the root handed to the first
  # instance as `0750` locks the second one's user out of its own home.
  #
  # the order of the two rollbacks is the other half. removing the SECOND must
  # leave the first untouched, packages included; removing everything must bring
  # the machine back to where it started. a job that only installed would prove
  # the easy half.
  # ---------------------------------------------------------------------------
  second-instance:
    name: two instances side by side (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package index refreshed (explicit test environment)
        run: sudo apt-get update

      # the assertions live in a file, not here: a script that only the workflow
      # can run is a script that gets *transcribed* to be tried on a VM, and the
      # transcription is where the difference hides (A-R8-1-ter).
      - name: Two instances installed, removed one at a time
        run: bash scripts/ci/second-instance-test.sh

      - name: The installer's log, if any
        if: always()
        run: sudo cp /var/log/invok.log installer-second-instance.log || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-second-instance
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Ctrl-C halfway through an installation (B-V3-5).
  #
  # until R18 the signal's default action applied to us too: the process died at
  # once and the in-process rollback never started. the only scenario no test
  # could reproduce — on mocks a flag can be raised, but one cannot prove that a
  # real signal does not kill the process before the flag is read.
  #
  # the moment of interruption is not arbitrary: it waits for the manifest to
  # record the database step. from there a real and expensive artifact exists, so
  # "the system came back clean" means something. a fixed sleep would hit a
  # different point every round.
  # ---------------------------------------------------------------------------
  interrupt:
    name: Ctrl-C halfway through an installation (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package index refreshed (explicit test environment)
        run: sudo apt-get update

      - name: Installation, interrupted as soon as the database exists
        run: |
          set -x
          sudo ./target/release/invok --config configs/ci.env > install.log 2>&1 &
          shell_pid=$!

          # it waits for a REAL artifact in the manifest, not for a duration.
          manifest=/var/lib/invok/state.json
          for _ in $(seq 1 240); do
            if sudo test -f "$manifest" && \
               sudo grep -q '"create-database"' "$manifest"; then
              echo "database created: interrupting"
              break
            fi
            if ! kill -0 "$shell_pid" 2>/dev/null; then
              echo "::error::the installation finished before it could be interrupted"
              cat install.log; exit 1
            fi
            sleep 2
          done

          # ONE signal, and to the installer only.
          #
          # matching on the command line would match **two** processes — the sudo
          # and the installer — so the installer would receive the signal twice in
          # quick succession. but the second one is, by design, the emergency exit:
          # it leaves at once and undoes NOTHING. the test would exercise the wrong
          # feature and fail while telling the truth.
          #
          # matching the exact process name leaves the sudo untouched. in a real
          # terminal the problem does not arise: Ctrl-C is delivered to the process
          # group once, and sudo without a pty does not forward it.
          sudo pkill -INT -x invok \
            || { echo "::error::no invok process to interrupt"; ps -ef | grep -i odoo; exit 1; }

          # it is given time to undo: the rollback drops the database, purges
          # packages, removes files. not instantaneous, and rightly so. we wait
          # for the INSTALLER to end and not for the sudo wrapping it.
          for _ in $(seq 1 300); do
            pgrep -x invok >/dev/null 2>&1 || break
            sleep 2
          done
          if pgrep -x invok >/dev/null 2>&1; then
            echo "::error::the installer did not exit after the interruption"
            sudo pkill -KILL -x invok || true
            cat install.log; exit 1
          fi
          # sudo exits right after its child; were it to hang, that is not the
          # product's problem but it would leave the job waiting.
          wait "$shell_pid" 2>/dev/null || true

          echo "--- the log's last lines ---"; tail -n 40 install.log

      # the real proof: the signal did not kill the process and the installer
      # undid its own work. had the rollback not started, the artifacts would all
      # still be here.
      - name: The system cleaned itself up
        run: |
          # the whole log BEFORE judging: an assertion that fails without showing
          # the evidence forces the next reader to guess.
          echo "::group::install.log"; cat install.log; echo "::endgroup::"

          if ! grep -qi "interrupt" install.log; then
            echo "::error::no trace of the interruption in the log (see above): the process was killed before undoing, or never received the signal"
            exit 1
          fi

          failed=0
          check() { # description, then a command that must FAIL
            if eval "$2" >/dev/null 2>&1; then
              echo "::error::$1"; failed=1
            else
              echo "  ✔ $1"
            fi
          }
          check "the odoo user is gone"              "id odoo"
          check "/opt/odoo is gone"                  "test -d /opt/odoo"
          check "the systemd unit is gone"           "test -f /etc/systemd/system/odoo18.service"

          # the database is checked ONLY if PostgreSQL answers. if the rollback
          # stopped it again — because we had started it — a failing query does
          # not prove the database is gone: it proves we cannot know. saying so
          # beats a tick that looked at nothing.
          if sudo -u postgres psql -tAc 'select 1' >/dev/null 2>&1; then
            check "the citest database is gone" \
              "sudo -u postgres psql -tAc \"select 1 from pg_database where datname='citest'\" | grep -q 1"
            check "the odoo role is gone" \
              "sudo -u postgres psql -tAc \"select 1 from pg_roles where rolname='odoo'\" | grep -q 1"
          else
            echo "  · PostgreSQL unreachable (stopped again by the rollback): the DB and role checks did not run"
          fi

          [ "$failed" -eq 0 ] || exit 1
          echo "✔ a real Ctrl-C produced a clean system, with no manual intervention"

      - name: The installer's log, if any
        if: always()
        run: sudo cp /var/log/invok.log installer-interrupt.log || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-interrupt
          path: |
            installer-*.log
            install.log
          if-no-files-found: ignore
