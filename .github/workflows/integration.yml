# =============================================================================
# .github/workflows/integration.yml
# Test di INTEGRAZIONE REALE: l'installer viene eseguito davvero (R5, audit B4).
#
# Perché esiste, in una riga: i mock provano la *logica*, non l'*integrazione
# col sistema*. La prima prova reale su Multipass ha trovato due bug ALTA in un
# solo giro — A-RT-1 (`dpkg -i` non risolve le dipendenze: l'installazione
# falliva su OGNI sistema minimale) e A-RT-2 (il purge del rollback falliva su
# dpkg rotto, lasciando 24 pacchetti) — con 148 test mock verdi. Questo workflow
# automatizza quella prova.
#
# Rapporto con gli altri workflow:
#   test.yml     → CI di qualità (fmt/clippy/test/build su mock, senza root),
#                  su OGNI push/PR. È il gate rapido e resta INVARIATO: il test
#                  reale non deve rallentare il ciclo di sviluppo.
#   release.yml  → binari su tag. Invariato.
#   questo       → lento (decine di minuti) e privilegiato. Su richiesta e sui
#                  soli rami principali.
#
# DISTRUTTIVO: crea utenti, installa pacchetti, tocca PostgreSQL e systemd.
# Gira solo su runner e container effimeri, che GitHub distrugge a fine job.
# =============================================================================

name: Integration (real install)

on:
  # Lancio manuale dalla UI: la via normale per validare un cambiamento prima
  # di taggare una release.
  workflow_dispatch:
  # Solo i rami principali. NON su ogni feature branch: sono 4 job da decine di
  # minuti ciascuno, e il feedback rapido è compito di test.yml.
  push:
    branches: [main, dev]

permissions:
  contents: read

# Un'integrazione alla volta per ref: sono job lunghi e i runner sono effimeri,
# quindi conviene cancellare quella superata invece di accodarla.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Il test completo: installazione reale, verifica che Odoo risponda, poi
  # `invok rollback` e verifica che il sistema sia tornato pulito.
  #
  # Gira sui runner GitHub **nativi**, non in container, per una ragione
  # precisa: sono VM vere con systemd come PID 1. In un container Docker
  # standard `systemctl` non funziona, e senza systemd non si può provare né
  # l'avvio del servizio né che il rollback lo rimuova — cioè metà del ciclo di
  # vita. I runner sono effimeri: sporcarli è esattamente ciò che vogliamo.
  # ---------------------------------------------------------------------------
  native:
    name: install + rollback (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # `pip install` compila gevent: è la parte lenta
    strategy:
      fail-fast: false # un OS che fallisce non deve nascondere gli altri
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      # Contesto utile a leggere un fallimento: cosa c'era già sulla macchina.
      # I runner GitHub NON sono minimali (git, curl, build-essential e
      # PostgreSQL sono preinstallati), il che rende questo job anche un test
      # dello scenario "macchina cliente non vergine": il delta apt sarà
      # piccolo e le risorse preesistenti dovranno sopravvivere al rollback.
      # L'indice apt dei runner GitHub è stantìo: l'immagine viene costruita
      # giorni prima e nessuno esegue `apt-get update` all'avvio. Dalla R6-hotfix
      # l'installer lo aggiorna da sé (nel run di bootstrap-prerequisites), quindi
      # questo passo è **ridondante per il prodotto** — resta per due ragioni:
      # rende esplicito lo stato dell'ambiente di test, e sposta il costo di rete
      # fuori dal cronometro dell'installazione.
      #
      # Nota: NON deve mascherare il fix. La copertura del caso "indice stantìo"
      # vive nei test su mock (`bootstrap_updates_the_index_so_the_next_step_sees_
      # the_candidates`), che non dipendono da come è tarato il runner.
      - name: Indice apt aggiornato (ambiente di test esplicito)
        run: sudo apt-get update

      - name: Stato iniziale della macchina
        run: |
          . /etc/os-release && echo "OS: $PRETTY_NAME"
          echo "PostgreSQL preinstallato: $(dpkg -s postgresql >/dev/null 2>&1 && echo sì || echo no)"
          echo "Servizio postgresql: $(systemctl is-active postgresql || true)"
          echo "Porta 8069: $(ss -lnt 'sport = :8069' | tail -n +2 | wc -l) listener"

      - name: Installazione reale + rollback verificato
        env:
          MODE: full
        run: bash scripts/ci/integration-test.sh

      # Il log su file. Da A-V3-2 vive in /var/log/invok.log e non
      # dipende più da una directory che l'installer deve ancora creare: nasce
      # quindi anche alla **prima** installazione su macchina pulita, che è il
      # caso in cui A-R5-2 lasciava senza post-mortem. Lo stderr resta comunque
      # nel log del job.
      - name: Log dell'installer, se presente
        if: always()
        run: sudo cp /var/log/invok.log "installer-${{ matrix.os }}.log" || true

      - name: Carica il log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-${{ matrix.os }}
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Binario statico per i job in container: musl gira su qualunque distro,
  # quindi lo stesso eseguibile va bene su Debian 11 e 12 senza compilare Rust
  # dentro ogni container. È anche il binario che release.yml consiglia ai
  # clienti: provarlo qui significa provare l'artefatto che spediamo davvero.
  # ---------------------------------------------------------------------------
  build-musl:
    name: build statico (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build release (musl, statico)
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - uses: actions/upload-artifact@v4
        with:
          name: invok-musl
          path: target/x86_64-unknown-linux-musl/release/invok
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Sonda di portabilità su Debian, in container.
  #
  # Limite dichiarato: in un container Docker standard systemd non è PID 1,
  # quindi `systemctl` esiste come binario ma non opera. L'installazione si
  # ferma per costruzione a `setup-postgres`, che è il primo step a chiedere un
  # servizio. Non è un test del ciclo di vita completo — quello è il job
  # `native` — ma copre esattamente la superficie che i runner Ubuntu non
  # possono coprire e che l'audit segnala come fragile:
  #
  #   A5.1  nomi dei pacchetti apt su una distro diversa (`libtiff5-dev`,
  #         `libjpeg8-dev`, `node-less` cambiano o scompaiono fra release). È il
  #         job che ha trovato il problema in R5 e che ora ne verifica il fix:
  #         dalla R6 la lista è di *gruppi di alternative* risolti a runtime, e
  #         su Debian il gruppo deve risolversi al nome che esiste lì. Se la
  #         risoluzione sbagliasse, `install-system-dependencies` tornerebbe a
  #         fallire esattamente qui;
  #   A5.2  mappatura codename → pin wkhtmltopdf, con `bookworm` e `bullseye`
  #         che hanno pin diretti (i runner Ubuntu esercitano solo `jammy` e il
  #         fallback `noble → jammy`);
  #   A-RT-1/2  su immagini davvero minimali, dove le dipendenze di sistema del
  #         `.deb` non ci sono e dpkg può restare rotto.
  #
  # E la parte che conta di più: comunque vada, il sistema deve restare pulito.
  # ---------------------------------------------------------------------------
  container:
    name: sonda portabilità (${{ matrix.image }})
    needs: build-musl
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:11"]
    container:
      image: ${{ matrix.image }}
      # L'installer va lanciato via sudo da un utente normale (check_sudo_user):
      # gli step girano da root e creano l'utente `tester` più sotto.
      options: --user root

    steps:
      # Il container è nudo: servono sudo (l'installer lo esige), git (per
      # checkout), jq (le asserzioni leggono il file di stato) e il pacchetto
      # systemd, che fornisce il binario `systemctl` richiesto da
      # check_commands. Il binario c'è, l'init no: è il limite dichiarato sopra.
      # L'`apt-get update` qui c'era già dal primo giorno (il container è nudo,
      # senza indice non si installa nemmeno `sudo`) — ed è la ragione per cui i
      # job Debian passavano mentre Ubuntu falliva: A5.1-bis si vedeva solo dove
      # nessuno aggiornava l'indice prima dell'installer.
      - name: Prerequisiti del container
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo git ca-certificates curl jq systemd procps

      - name: Utente non-root con sudo (come su una macchina vera)
        run: |
          set -eux
          useradd -m -s /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          chmod 440 /etc/sudoers.d/tester

      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: invok-musl
          path: bin

      - name: Prepara il binario e i permessi
        run: |
          set -eux
          chmod +x bin/invok
          bin/invok --help >/dev/null
          # Il workspace è di root: l'installer gira come `tester` via sudo e
          # deve poter leggere config e script.
          chown -R tester:tester "$GITHUB_WORKSPACE"

      - name: Sonda di portabilità (installazione reale + pulizia)
        run: |
          su tester -c "cd '$GITHUB_WORKSPACE' && MODE=probe BIN=./bin/invok bash scripts/ci/integration-test.sh"

      - name: Log dell'installer, se presente
        if: always()
        run: |
          tag="$(echo '${{ matrix.image }}' | tr ':' '-')"
          cp /var/log/invok.log "installer-$tag.log" 2>/dev/null || true

      - name: Carica il log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-${{ strategy.job-index }}
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Fedora: il ciclo di vita completo, con systemd come PID 1.
  #
  # GitHub non offre runner Fedora, e il job `container:` qui sopra non basta —
  # lì systemd non è PID 1, quindi l'installazione si fermerebbe per costruzione
  # a `setup-postgres`. Su Fedora quel limite morderebbe **più forte** che su
  # Debian: si fermerebbe *prima* dell'init del cluster, cioè proprio la
  # divergenza più rischiosa di tutto il lavoro multi-distro (M3).
  #
  # Da qui la scelta: un container avviato a mano con `/usr/sbin/init` come
  # comando, `--privileged` e i cgroup dell'host, così systemd fa PID 1 davvero
  # e il ciclo installazione → servizio attivo → rollback diventa verificabile.
  #
  # **L'immagine base `fedora:N` NON contiene systemd** — verificato al primo
  # tentativo, che è morto con `stat /usr/sbin/init: no such file or directory`.
  # Le immagini Fedora sono minimali: `/usr/sbin/init` è un symlink fornito dal
  # pacchetto `systemd`, che lì non c'è. Serve quindi costruire un'immagine
  # intermedia — ed è anche il posto giusto per i prerequisiti del test, che così
  # non vanno reinstallati a ogni esecuzione degli step.
  #
  # **Se systemd non si alza**, il job fallisce esplicitamente invece di
  # degradare a sonda in silenzio: un job che passa senza aver provato ciò per
  # cui esiste è peggio di un job assente (la lezione di R7).
  # ---------------------------------------------------------------------------
  fedora:
    name: install + rollback (${{ matrix.image }}, ${{ matrix.scenario }})
    needs: build-musl
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Nessuna voce tollerata in rosso: da M11 tutte e tre sono bloccanti, ed è
    # ciò che rende vera la costante `NEWEST_TESTED_FEDORA` (un test la lega
    # alla matrice).
    strategy:
      fail-fast: false
      matrix:
        # Due scenari, non uno. Lo scenario `nginx` è l'unico modo di esercitare
        # `Firewalld`: sui runner e nella VM di sviluppo `firewall-cmd` non c'è,
        # quindi le sue cinque operazioni sono vissute finora solo sui mock — la
        # stessa situazione di B-V3-7 per nginx su Debian, e in questo progetto
        # è dove i difetti sopravvivono.
        #
        # `configs/ci-nginx.env` è lo stesso file che usa il job Debian: un test
        # garantisce che differisca da `ci.env` solo per WITH_NGINX e
        # NGINX_SERVER_NAME, così un rosso che compare solo qui è attribuibile a
        # nginx e a nient'altro.
        include:
          - image: "fedora:41"
            scenario: base
            env_file: configs/ci.env
            firewalld: "no"
          - image: "fedora:41"
            scenario: nginx
            env_file: configs/ci-nginx.env
            firewalld: "yes"
            # Lo scenario DICHIARA di volere il firewall: se non fosse attivo,
            # le verifiche su A-V3-7 salterebbero e il job passerebbe senza aver
            # provato ciò per cui esiste. Con questo, si ferma e lo dice.
            fw_required: "1"
          # Fedora 44: la release il cui `python3` di sistema è **3.14**, che i
          # pin di Odoo 18 non coprono. Bloccante da M11, e non per ottimismo:
          # è l'unica voce della matrice che esercita la scelta dell'interprete
          # alternativo. `fedora:41` copre il ramo opposto — Python di sistema
          # 3.13, coperto dai pin, nessun interprete in più da installare — e i
          # due insieme sono i due rami di `choose_python`.
          #
          # Era una sonda tollerata in rosso finché la domanda era aperta. Ora la
          # risposta c'è (VM Fedora 44: con `python3.13` l'intero
          # `requirements.txt` si installa), quindi un rosso qui è un difetto e
          # deve fermare tutto: un rosso che ci si aspetta di vedere insegna a
          # ignorare i rossi (A-V3-10), e tenere «tollerata» una release che
          # dichiariamo supportata sarebbe la stessa bugia al contrario.
          - image: "fedora:44"
            scenario: base
            env_file: configs/ci.env
            firewalld: "no"
            fw_required: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: invok-musl
          path: bin

      - name: Immagine con systemd e i prerequisiti del test
        run: |
          set -eux
          # Heredoc QUOTATO: senza le virgolette bash interpreterebbe i `\` di
          # continuazione e unirebbe le righe del Dockerfile. `${{ matrix.image }}`
          # lo sostituisce GitHub prima che bash veda lo script, quindi il
          # quoting non gli toglie nulla.
          cat > Dockerfile.ci <<'DOCKERFILE'
          FROM FEDORA_IMAGE
          # systemd: senza, /usr/sbin/init non esiste e il container non parte.
          # Gli altri sono prerequisiti del TEST, non dell'installer: sudo (che
          # l'installer esige), git (clone dei sorgenti), jq (le asserzioni
          # leggono il manifesto), procps-ng (`ps`).
          #
          # `firewalld` + `nftables` + `dbus-broker`: su una Fedora vera firewalld
          # è preinstallato, quindi averlo nell'immagine è fedele e non uno
          # sconto. Viene AVVIATO solo nello scenario `nginx` — è lì che
          # `nginx-firewall` ha qualcosa da fare. `nftables` è il backend e il
          # bus di sistema è il canale su cui `firewall-cmd` parla col demone:
          # senza uno dei due firewalld parte e poi non risponde, che è il modo
          # peggiore di fallire.
          #
          # `dbus-broker` e non `dbus-daemon`, ed è la correzione del rosso della
          # sonda Fedora 44 (M7). Il bus di sistema **non serve solo a firewalld**:
          # `postgresql-setup --initdb` lascia root al primo comando (`runuser -l
          # postgres`) e solo DOPO chiede a systemd dov'è il PGDATA — da root
          # `systemctl` userebbe il socket privato `/run/systemd/private` e non
          # chiederebbe niente a nessuno, da utente non privilegiato deve passare
          # dal bus. Senza bus quelle `systemctl show` falliscono e lo script muore
          # con «no db datadir (PGDATA) found», che manda a cercare `--datadir`,
          # cioè lontano dalla causa.
          #
          # `dbus-broker` è l'implementazione **di default di Fedora** ed è quella
          # che il preset abilita; `dbus-daemon` è l'alternativa, e installarla con
          # i weak deps disattivati lasciava l'immagine con il pacchetto ma senza
          # un bus attivo. Lo scenario `nginx` non se n'era accorto perché
          # `systemctl start firewalld` il bus se lo tira dietro; lo scenario base
          # non lo avvia mai, ed è lì che la sonda è morta.
          #
          # `diffutils` porta `cmp`/`diff`: senza, il confronto byte-per-byte
          # del manifesto (A-V3-1) non può eseguire — e `cmp` assente esce
          # non-zero esattamente come `cmp` che trova una differenza.
          #
          # `iproute` porta `ss`, e non è un dettaglio: senza, il preflight
          # sulle porte scrive «ss/netstat/lsof assenti: assumo libera» e
          # **non può fallire**. È la firma ricorrente di questo progetto
          # comparsa nell'ambiente di test invece che nel codice: il rifiuto
          # della seconda installazione (A-R9-1) sta proprio nell'ORDINE fra il
          # controllo sulle porte e la lettura del manifesto, e con `ss` assente
          # quel test non distingue l'ordine corretto da quello rotto.
          RUN dnf -y install --setopt=install_weak_deps=False \
                systemd sudo git jq procps-ng iproute diffutils authselect \
                firewalld nftables dbus-broker \
           && dnf clean all
          # Il bus si ABILITA a mano invece di fidarsi del preset: in
          # un'immagine container i preset sono applicati dagli scriptlet rpm, e
          # dare per scontato che l'abbiano fatto è ciò che ha lasciato la sonda
          # senza bus. `dbus.socket` è di norma già abilitata (o statica): la si
          # tocca solo se risulta `disabled`, così un cambio di packaging non fa
          # fallire il build per una differenza che non conta.
          RUN systemctl enable dbus-broker.service \
           && { systemctl is-enabled dbus.socket >/dev/null 2>&1 \
                || systemctl enable dbus.socket ; }
          # Unit che in un container non hanno senso e fallirebbero, portando
          # systemd a `degraded` per rumore invece che per una ragione vera.
          RUN systemctl mask \
                systemd-remount-fs.service \
                dev-hugepages.mount \
                sys-fs-fuse-connections.mount \
                console-getty.service \
                getty.target
          # PAM in un container Fedora, due cose che mancano.
          #
          # 1) `/etc/pam.d/sudo` include `system-auth`, che su Fedora è un
          #    symlink gestito da `authselect`. In un'immagine container
          #    authselect non è mai stato inizializzato, quindi quel link non
          #    risolve: PAM non trova i moduli e l'account management fallisce
          #    con «Authentication service cannot retrieve authentication info».
          #    È la causa vera dei due giri precedenti — e non si vedeva dalla
          #    configurazione di sudo, che era corretta.
          #
          #    Si applica un profilo; se `authselect` non è utilizzabile, si
          #    scrive a mano una configurazione minima basata su `pam_unix`. Il
          #    `test -e` segue il symlink, quindi risponde `false` proprio nel
          #    caso che ci interessa: link presente ma rotto.
          RUN authselect select minimal --force 2>/dev/null \
           || authselect select local --force 2>/dev/null \
           || authselect select sssd --force 2>/dev/null \
           || true
          RUN test -e /etc/pam.d/system-auth || printf '%s\n' \
                'auth     sufficient pam_unix.so nullok' \
                'auth     required   pam_deny.so' \
                'account  required   pam_unix.so' \
                'password sufficient pam_unix.so' \
                'password required   pam_deny.so' \
                'session  required   pam_unix.so' \
                > /etc/pam.d/system-auth
          # 1-bis) Anche con `system-auth` risolto, `pam_unix` in account
          #    management continua a rispondere «cannot retrieve authentication
          #    info»: legge `/etc/shadow` e in questo container non ci riesce.
          #
          #    Qui si smette di inseguire la causa e si cambia la domanda.
          #    **`sudo` è infrastruttura del test, non il suo oggetto**: serve a
          #    lanciare l'installer come una persona lo lancerebbe, e la sua
          #    catena PAM non è ciò che stiamo verificando. In un'immagine
          #    container non è configurabile in modo affidabile — tre tentativi
          #    lo hanno mostrato — quindi la si sostituisce con una permissiva.
          #
          #    **Cosa si perde, dichiarato**: questo job non prova più che `sudo`
          #    funzioni su una Fedora vera. Quella prova esiste altrove ed è più
          #    forte — l'installazione manuale su VM Fedora 41, dove `sudo` è
          #    quello della distribuzione. Il container copre ciò che la VM non
          #    può dare: la ripetibilità a ogni push.
          #
          #    Il container è usa-e-getta, privilegiato e senza rete esposta:
          #    una catena PAM permissiva qui non apre nulla che non fosse già
          #    aperto da `--privileged`.
          RUN printf '%s\n' \
                '#%PAM-1.0' \
                '# Sostituita nel container di CI: vedi il commento nel workflow.' \
                'auth       sufficient   pam_permit.so' \
                'account    sufficient   pam_permit.so' \
                'session    optional     pam_keyinit.so revoke' \
                'session    required     pam_limits.so' \
                'session    sufficient   pam_permit.so' \
                > /etc/pam.d/sudo
          # 2) `pam_faillock` vuole la propria directory di stato, che
          #    `systemd-tmpfiles` creerebbe ma non prima che PAM ne abbia bisogno.
          RUN mkdir -p /run/faillock /var/run/faillock
          CMD ["/usr/sbin/init"]
          DOCKERFILE
          sed -i "s|FEDORA_IMAGE|${{ matrix.image }}|" Dockerfile.ci
          cat Dockerfile.ci
          docker build -t invok-fedora:ci -f Dockerfile.ci .

      - name: Avvia il container con systemd come PID 1
        run: |
          set -eux
          chmod +x bin/invok
          docker run -d --name fedora-test \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            invok-fedora:ci

          # systemd ci mette qualche secondo ad arrivare a regime. `degraded` va
          # bene: in un container alcune unit non partono (e non ci servono), ma
          # il gestore dei servizi funziona — che è tutto ciò che l'installer
          # chiede.
          for _ in $(seq 1 30); do
            stato="$(docker exec fedora-test systemctl is-system-running 2>/dev/null || true)"
            case "$stato" in running|degraded) break ;; esac
            sleep 2
          done

          stato="$(docker exec fedora-test systemctl is-system-running 2>/dev/null || true)"
          echo "systemd: ${stato:-non disponibile}"
          case "$stato" in
            running|degraded) ;;
            *)
              echo "::error::systemd non è arrivato a regime nel container: senza PID 1 questo job proverebbe meno di quanto promette"
              docker logs fedora-test | tail -50
              exit 1
              ;;
          esac

      - name: Utente non-root con sudo (come su una macchina vera)
        run: |
          set -eux
          docker exec fedora-test useradd -m -s /bin/bash tester
          # Una password vera: `useradd` da solo lascia l'account **bloccato**
          # (`!` in /etc/shadow), e su alcune configurazioni PAM l'account
          # management di un account bloccato non passa nemmeno con NOPASSWD.
          docker exec fedora-test bash -c "echo 'tester:tester' | chpasswd"
          docker exec fedora-test bash -c "echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester"
          docker exec fedora-test chmod 440 /etc/sudoers.d/tester
          docker exec fedora-test mkdir -p /run/faillock
          docker exec fedora-test chown -R tester:tester /work

      # Prima di lanciare mezz'ora di installazione, si verifica che il
      # prerequisito più banale funzioni. Al primo giro `sudo` falliva per PAM e
      # il job se n'è accorto **dopo**, da un exit code 1 dell'installer: la
      # diagnosi era a due passi di distanza dalla causa.
      #
      # Se qui fallisce, si stampa ciò che serve a capirlo invece di lasciare il
      # prossimo a indovinare.
      - name: sudo funziona? (prerequisito, non l'oggetto del test)
        run: |
          if docker exec -u tester fedora-test sudo -n true; then
            echo "sudo: ok"
            exit 0
          fi
          echo "::error::sudo non funziona per l'utente di test: l'installer non partirebbe nemmeno"
          docker exec fedora-test bash -c '
            echo "--- getent passwd tester ---"; getent passwd tester
            echo "--- shadow (solo presenza) ---"; grep -c "^tester:" /etc/shadow
            echo "--- sudoers.d ---"; ls -l /etc/sudoers.d/; cat /etc/sudoers.d/tester
            echo "--- pam.d/sudo ---"; cat /etc/pam.d/sudo
            echo "--- system-auth (il sospetto n.1: symlink authselect) ---"
            ls -l /etc/pam.d/system-auth 2>&1
            readlink -f /etc/pam.d/system-auth 2>&1
            cat /etc/pam.d/system-auth 2>&1 | head -20
            echo "--- faillock ---"; ls -ld /run/faillock 2>&1
            echo "--- sudo setuid? (se manca, pam_unix non puo\x27 leggere shadow) ---"
            ls -l /usr/bin/sudo 2>&1
            echo "--- nsswitch shadow/passwd ---"; grep -E "^(passwd|shadow):" /etc/nsswitch.conf 2>&1
            echo "--- sudo verbose ---"; su tester -c "sudo -n true" 2>&1 | tail -20
          ' || true
          exit 1

      # Il secondo prerequisito, e la ragione per cui è ASSERITO invece che
      # dato per scontato dall'immagine.
      #
      # `postgresql-setup --initdb` chiede a systemd dov'è il PGDATA **dopo**
      # aver lasciato root (`runuser -l postgres`), quindi la domanda vera non è
      # «systemd è PID 1?» ma «un utente non privilegiato riesce a interrogare
      # systemd?» — che è ciò che si chiede qui, nella stessa forma in cui serve.
      #
      # Le due cose divergono, e la sonda Fedora 44 (M7) è caduta esattamente
      # nella loro differenza: systemd era PID 1, il bus di sistema no. Il
      # ripiego di `postgresql-setup` per i container («Support for containers»,
      # 8.10) non l'ha salvata perché è gated su «systemd NON è PID 1»: un
      # container con systemd ma senza bus cade nel buco fra i due casi previsti.
      # Il sintomo era `no db datadir (PGDATA) found`, cioè un messaggio che
      # manda a cercare `--datadir` mentre la causa è il bus.
      #
      # Stessa scelta del check `sudo -n true` qui sopra: un prerequisito si
      # verifica dove lo si può nominare, non lo si scopre otto step dopo
      # travestito da errore dell'installer.
      #
      # `systemctl show` su una unit inesistente esce comunque 0 (stampa i
      # default): quindi qui un fallimento significa **il bus**, non `dbus.service`
      # — che è esattamente ciò che si vuole misurare, e il motivo per cui la unit
      # interrogata non conta.
      - name: Il bus di sistema risponde a un utente non privilegiato?
        run: |
          if docker exec -u tester fedora-test systemctl show -p Environment dbus.service >/dev/null 2>&1; then
            echo "bus di sistema: ok"
            exit 0
          fi
          echo "::error::il bus di sistema D-Bus non risponde a un utente non privilegiato: postgresql-setup --initdb morirebbe con «no db datadir (PGDATA) found», che è la causa sbagliata"
          docker exec fedora-test bash -c '
            echo "--- socket del bus ---"; ls -l /run/dbus/ 2>&1
            echo "--- unit del bus ---"
            systemctl is-enabled dbus.socket dbus-broker.service 2>&1
            systemctl is-active  dbus.socket dbus-broker.service 2>&1
            echo "--- status ---"; systemctl status dbus-broker.service --no-pager -l 2>&1 | head -30
            echo "--- journal ---"; journalctl -u dbus-broker.service -n 30 --no-pager 2>&1
            echo "--- da root funziona? (se sì, è il bus e non systemd) ---"
            systemctl show -p Environment dbus.service 2>&1
          ' || true
          exit 1

      # Firewalld ATTIVO, con la trappola deliberata. È l'analogo esatto di ciò
      # che R17 ha fatto per `ufw` su Debian, e serve alla stessa asserzione:
      # `8080/tcp` già aperta CONTIENE la stringa `80/tcp`, quindi un confronto
      # per sottostringa concluderebbe che la porta 80 è già aperta. Da lì la
      # regola non entrerebbe nel delta, il `run` non la aprirebbe, e nginx
      # resterebbe irraggiungibile **senza alcun errore** (A-V3-7).
      #
      # `Firewalld::rule_exists` legge il PERMANENTE, quindi la trappola si
      # mette permanente e si ricarica: una porta aperta solo a runtime
      # sparirebbe e il test non chiederebbe la stessa cosa che chiede la
      # produzione.
      - name: Firewalld attivo, con 8080/tcp già aperta (trappola per A-V3-7)
        if: matrix.firewalld == 'yes'
        run: |
          set -eux
          docker exec fedora-test systemctl start firewalld || true

          for _ in $(seq 1 20); do
            if docker exec fedora-test firewall-cmd --state >/dev/null 2>&1; then break; fi
            sleep 2
          done

          # Un firewalld che non si alza va DETTO, non aggirato: se lo scenario
          # saltasse in silenzio le verifiche sul firewall, questo job
          # prometterebbe una copertura che non ha — ed è esattamente il difetto
          # che R7 ha trovato nella CI (un test che asseriva il residuo come
          # atteso è peggio di un test assente).
          if ! docker exec fedora-test firewall-cmd --state; then
            echo "::error::firewalld non è partito nel container: lo scenario nginx non eserciterebbe Firewalld, che è la sola ragione per cui esiste"
            docker exec fedora-test systemctl status firewalld --no-pager -l || true
            docker exec fedora-test journalctl -u firewalld -n 50 --no-pager || true
            exit 1
          fi

          docker exec fedora-test firewall-cmd --permanent --add-port=8080/tcp
          docker exec fedora-test firewall-cmd --reload
          docker exec fedora-test firewall-cmd --permanent --list-ports

      - name: Installazione + rollback reali
        run: |
          docker exec -u tester -w /work fedora-test \
            env MODE=full BIN=./bin/invok \
                ENV_FILE='${{ matrix.env_file }}' \
                FW_REQUIRED='${{ matrix.fw_required }}' \
            bash scripts/ci/integration-test.sh

      - name: Log dell'installer, se presente
        if: always()
        run: |
          tag="$(echo '${{ matrix.image }}' | tr ':' '-')"
          docker cp "fedora-test:/var/log/invok.log" "installer-$tag.log" 2>/dev/null || true

      - name: Carica il log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-fedora-${{ matrix.scenario }}
          path: installer-*.log
          if-no-files-found: ignore

      - name: Ferma il container
        if: always()
        run: docker rm -f fedora-test || true

  # ---------------------------------------------------------------------------
  # La fase Nginx, che nessuna esecuzione reale aveva mai toccato (B-V3-7).
  #
  # `configs/ci.env` ha `WITH_NGINX="false"`: i cinque step nginx uscivano al
  # primo `if` in ogni installazione reale mai fatta. Il vhost non veniva mai
  # scritto né validato da `nginx -t`, il default site mai rimosso né
  # ripristinato. Due fasi intere — A-V3-5 (il ripristino fedele del default
  # site) e A-V3-6 (il vhost che non promette TLS) — vivevano solo su mock.
  #
  # In questo progetto i difetti sono stati trovati quasi sempre da una macchina
  # vera; l'unico difetto nginx mai emerso (A1.4) l'ha trovato un test end-to-end
  # e non una rilettura. Questo job chiude l'ultima zona non osservata.
  #
  # Un solo OS: la fase nginx non ha differenze fra jammy e noble (nessun nome di
  # pacchetto condizionale, nessun pin per codename), quindi un secondo runner
  # costerebbe quaranta minuti per ripetere le stesse asserzioni.
  # ---------------------------------------------------------------------------
  nginx:
    name: install + rollback con Nginx (default site ${{ matrix.default_site }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Le DUE nature del default site (A-V3-5). Un ciclo installazione+rollback
      # ne esercita una sola, e sono trattate da rami diversi:
      #   symlink       → si rimuove e si ricrea verso il target REGISTRATO;
      #   regular-file  → si sposta in un backup e l'undo lo rimette.
      # Il secondo è quello grave — l'unico punto dell'audit in cui si *perde*
      # configurazione del cliente — e finché non girava era coperto solo da
      # mock. In matrice i due job vanno in parallelo: il wall-clock non cambia.
      matrix:
        default_site: [symlink, regular-file]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Indice apt aggiornato (ambiente di test esplicito)
        run: sudo apt-get update

      # Il default site dev'esserci **davvero**: è l'artefatto di terzi che il
      # rollback deve rimettere a posto (A-V3-5), e senza di esso metà delle
      # asserzioni non avrebbe nulla da osservare. Sui runner nginx è
      # preinstallato ma la configurazione varia: lo si mette in uno stato noto.
      - name: Nginx attivo con il default site (${{ matrix.default_site }})
        run: |
          sudo apt-get install -y nginx
          sudo rm -f /etc/nginx/sites-enabled/default

          if [ "${{ matrix.default_site }}" = "symlink" ]; then
            # Il caso della distribuzione: un link a sites-available/default.
            sudo ln -sfn /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
          else
            # Il caso che perde dati: un amministratore che ha scritto il file
            # direttamente in sites-enabled. `symlink_exists` rispondeva `true`
            # anche qui e `remove_symlink` è `fs::remove_file`: il contenuto
            # veniva distrutto e l'undo restituiva un symlink al default della
            # distro. Il marcatore serve a provare che torni **quel** file.
            sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
            printf '\n# marcatore-del-cliente-%s\n' "$GITHUB_RUN_ID" | sudo tee -a /etc/nginx/sites-enabled/default >/dev/null
            sudo sha256sum /etc/nginx/sites-enabled/default | sudo tee /tmp/default-site.sha256
          fi

          sudo systemctl restart nginx
          echo "default site:"; ls -l /etc/nginx/sites-enabled/

      # ufw ATTIVO: è l'unico modo di esercitare `nginx-firewall`, che sui runner
      # esce sempre subito perché ufw è installato ma inattivo — A-V3-7 non era
      # mai stato provato in campo.
      #
      # La regola `8080/tcp` è una **trappola deliberata**: con il confronto per
      # sottostringa di prima, `"80/tcp"` risultava presente perché contenuto in
      # `"8080/tcp"`, la porta 80 non entrava nel delta e non veniva aperta. Il
      # sintomo sarebbe stato «Odoo non risponde sulla 80», non un errore.
      - name: ufw attivo, con la trappola 8080/tcp (A-V3-7)
        run: |
          sudo apt-get install -y ufw
          # Prima le regole, poi l'enable: `--force` mette default deny in
          # ingresso, e senza queste il runner si chiuderebbe fuori da sé.
          sudo ufw allow OpenSSH || sudo ufw allow 22/tcp
          sudo ufw allow 8080/tcp
          sudo ufw --force enable
          sudo ufw status verbose

      - name: Installazione reale + rollback verificato (con Nginx)
        env:
          MODE: full
          ENV_FILE: configs/ci-nginx.env
          # Questo job ATTIVA ufw da sé nello step precedente: trovarlo inattivo
          # non sarebbe una circostanza della macchina ma un difetto del job, e
          # saltare in silenzio le verifiche lascerebbe A-V3-7 scoperto proprio
          # nello scenario scritto per esercitarlo.
          FW_REQUIRED: "1"
        run: bash scripts/ci/integration-test.sh

      # Il file del cliente dev'essere tornato **identico**, non "di solito
      # giusto": è la differenza fra ripristinare e rimpiazzare.
      - name: Il default site regolare è tornato byte-per-byte
        if: matrix.default_site == 'regular-file'
        run: |
          sudo test -f /etc/nginx/sites-enabled/default \
            || { echo "::error::il file del cliente non è tornato"; exit 1; }
          sudo test ! -L /etc/nginx/sites-enabled/default \
            || { echo "::error::era un FILE, è tornato un symlink (A-V3-5)"; exit 1; }
          sudo sha256sum -c /tmp/default-site.sha256 \
            || { echo "::error::il contenuto è cambiato: configurazione del cliente persa"; exit 1; }
          sudo grep -q "marcatore-del-cliente" /etc/nginx/sites-enabled/default \
            || { echo "::error::il marcatore è sparito: non è il file originale"; exit 1; }
          echo "✔ il file del cliente è tornato identico"

      - name: Log dell'installer, se presente
        if: always()
        run: sudo cp /var/log/invok.log "installer-nginx-${{ matrix.default_site }}.log" || true

      - name: Carica il log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-nginx-${{ matrix.default_site }}
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # L'utente `odoo` già presente sulla macchina (B-V3-7, chiude A-V3-4).
  #
  # È la precondizione del finding, e i runner non ce l'hanno mai avuta: la
  # correzione della R10 — `PrepareOptRoot` che consegna la home a un utente già
  # esistente — non era quindi mai stata eseguita davvero.
  #
  # Due scenari, in quest'ordine, perché il primo lascia il sistema come serve al
  # secondo dopo una sola pulizia:
  #   1. utente presente + /opt/odoo preesistente di root → l'installazione deve
  #      RIFIUTARSI con una precondizione esplicita, prima di mutare;
  #   2. utente presente + /opt/odoo assente → l'installazione riesce, e la home
  #      creata da noi viene consegnata all'utente. Il rollback la rimuove ma
  #      **lascia l'utente**, che non è nostro.
  # ---------------------------------------------------------------------------
  preexisting-user:
    name: utente odoo preesistente (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Indice apt aggiornato (ambiente di test esplicito)
        run: sudo apt-get update

      - name: Utente 'odoo' già presente, senza home
        run: |
          sudo useradd --system --home-dir /opt/odoo --shell /bin/false odoo
          id odoo
          test ! -d /opt/odoo && echo "/opt/odoo non esiste: corretto per lo scenario 2"

      # Scenario 1: la home c'è, è di root, e non l'abbiamo creata noi. Non la
      # chowniamo (non è nostra) e l'installazione si deve fermare PRIMA di
      # mutare, dicendo perché. Senza questa precondizione l'errore arrivava tre
      # step dopo, come `mkdir: Permission denied`.
      - name: Scenario 1 — home root-owned preesistente → rifiuto esplicito
        run: |
          sudo mkdir -p /opt/odoo
          set +e
          sudo ./target/release/invok --config configs/ci.env > refuse.log 2>&1
          rc=$?
          set -e
          echo "exit code: $rc"; cat refuse.log

          [ "$rc" -ne 0 ] || { echo "::error::l'installazione doveva essere rifiutata"; exit 1; }
          grep -q "/opt/odoo" refuse.log || { echo "::error::il messaggio non nomina la home"; exit 1; }
          grep -qi "root" refuse.log     || { echo "::error::il messaggio non dice di chi è la home"; exit 1; }
          grep -q "chown"  refuse.log    || { echo "::error::il messaggio non dice cosa fare"; exit 1; }

          # Precondizione, non undo: nessun artefatto creato.
          #
          # NON si pretende che il manifesto sia assente: la precondizione vive
          # nello snapshot del secondo step, e il primo (`prepare-opt-root`) è
          # già passato — senza mutare, perché la directory era preesistente — e
          # il motore ha persistito quel record. Che il file esista è corretto;
          # a contare è che non descriva nulla di creato da noi.
          [ -z "$(sudo ls -A /opt/odoo)" ] || { echo "::error::ha mutato /opt/odoo prima di rifiutare"; exit 1; }
          test ! -d /opt/odoo/odoo18 || { echo "::error::ha creato la install dir"; exit 1; }
          test ! -f /etc/systemd/system/odoo18.service || { echo "::error::ha installato l'unit"; exit 1; }
          if sudo test -f /var/lib/invok/state.json; then
            if sudo grep -q '"CreatedByUs"' /var/lib/invok/state.json; then
              echo "::error::il manifesto registra artefatti creati da noi: la precondizione non ha fermato nulla"
              sudo cat /var/lib/invok/state.json
              exit 1
            fi
            echo "  manifesto presente ma senza artefatti nostri: corretto"
          fi
          echo "✔ rifiutata prima di mutare, con un messaggio che dice cosa fare"

          # Si consuma il manifesto parziale con il comando previsto, invece di
          # cancellarlo a mano: altrimenti lo scenario 2 lo troverebbe e
          # partirebbe come **resume**, saltando `prepare-opt-root` — cioè
          # proprio lo step che deve creare e consegnare la home.
          sudo ./target/release/invok rollback --yes || true
          sudo rmdir /opt/odoo
          sudo test ! -e /var/lib/invok/state.json \
            || { echo "::error::il manifesto parziale non è stato consumato"; exit 1; }

      # Scenario 2: la home la creiamo noi, e va consegnata subito all'utente che
      # esiste già — altrimenti `setup-cache-dir` muore su un `mkdir` come odoo.
      - name: Scenario 2 — installazione, consegna della home, rollback
        env:
          MODE: full
        run: bash scripts/ci/integration-test.sh

      # La verifica specifica di A-V3-4 vive qui e non nello script: lo script
      # controlla lo stato finale, questo controlla che l'utente preesistente sia
      # sopravvissuto a un rollback che ha rimosso tutto il resto.
      - name: L'utente preesistente è sopravvissuto
        run: |
          id odoo || { echo "::error::il rollback ha rimosso un utente che non aveva creato"; exit 1; }
          test ! -d /opt/odoo || { echo "::error::/opt/odoo doveva sparire: l'avevamo creata noi"; exit 1; }
          echo "✔ utente preesistente intatto, home creata da noi rimossa"

      - name: Log dell'installer, se presente
        if: always()
        run: sudo cp /var/log/invok.log installer-preexisting-user.log || true

      - name: Carica il log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-preexisting-user
          path: installer-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Ctrl-C a metà installazione (B-V3-5).
  #
  # Fino alla R18 l'azione di default di SIGINT valeva anche per noi: il processo
  # moriva all'istante e il rollback in-process non partiva mai. Era l'unico
  # scenario che nessun test poteva riprodurre — su mock si può alzare un flag,
  # ma non si può provare che un segnale reale non uccida il processo prima che
  # il flag venga letto.
  #
  # Il momento dell'interruzione non è casuale: si aspetta che il manifesto
  # registri `create-database`. Da lì c'è un artefatto vero e costoso da
  # annullare — un database — quindi «il sistema è tornato pulito» significa
  # qualcosa. Un `sleep` fisso avrebbe colpito un punto diverso a ogni giro.
  # ---------------------------------------------------------------------------
  interrupt:
    name: Ctrl-C a metà installazione (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache di cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Indice apt aggiornato (ambiente di test esplicito)
        run: sudo apt-get update

      - name: Installazione, interrotta appena il database esiste
        run: |
          set -x
          sudo ./target/release/invok --config configs/ci.env > install.log 2>&1 &
          shell_pid=$!

          # Si aspetta un artefatto REALE nel manifesto, non un tempo.
          manifesto=/var/lib/invok/state.json
          for _ in $(seq 1 240); do
            if sudo test -f "$manifesto" && \
               sudo grep -q '"create-database"' "$manifesto"; then
              echo "database creato: interrompo"
              break
            fi
            if ! kill -0 "$shell_pid" 2>/dev/null; then
              echo "::error::l'installazione è terminata prima di poterla interrompere"
              cat install.log; exit 1
            fi
            sleep 2
          done

          # UN solo segnale, e all'installer soltanto.
          #
          # `pkill -f 'invok --config'` matcherebbe **due** processi —
          # il `sudo` e l'installer — quindi l'installer riceverebbe SIGINT due
          # volte in rapida successione. Ma il secondo SIGINT è, per progetto,
          # la via d'uscita d'emergenza: esce subito con 130 e NON annulla
          # niente. Il test proverebbe la funzionalità sbagliata, e fallirebbe
          # dicendo il vero («il processo è stato ucciso»).
          #
          # `-x` matcha il nome esatto del processo (`invok`), non la
          # riga di comando: `sudo` non viene toccato. In un terminale vero il
          # problema non si pone — Ctrl-C consegna al process group una volta
          # sola, e sudo senza pty non rilancia il segnale.
          sudo pkill -INT -x invok \
            || { echo "::error::nessun processo invok da interrompere"; ps -ef | grep -i odoo; exit 1; }

          # Gli si dà il tempo di annullare: il rollback fa dropdb, purge apt,
          # rimozioni. Non è istantaneo, ed è giusto così. Si aspetta la fine
          # dell'INSTALLER, non del `sudo` che lo avvolge: sono due processi e
          # possono terminare in momenti diversi.
          for _ in $(seq 1 300); do
            pgrep -x invok >/dev/null 2>&1 || break
            sleep 2
          done
          if pgrep -x invok >/dev/null 2>&1; then
            echo "::error::l'installer non è terminato dopo l'interruzione"
            sudo pkill -KILL -x invok || true
            cat install.log; exit 1
          fi
          # `sudo` esce subito dopo il figlio; se restasse appeso, non è un
          # problema del prodotto ma lascerebbe il job in attesa.
          wait "$shell_pid" 2>/dev/null || true

          echo "--- ultime righe del log ---"; tail -n 40 install.log

      # La prova vera: il segnale non ha ucciso il processo, e l'installer ha
      # annullato da sé. Se il rollback non fosse partito, gli artefatti
      # sarebbero ancora tutti qui.
      - name: Il sistema è tornato pulito da solo
        run: |
          # Il log per intero PRIMA di giudicare: un'asserzione che fallisce
          # senza mostrare l'evidenza costringe il prossimo a indovinare.
          echo "::group::install.log"; cat install.log; echo "::endgroup::"

          if ! grep -qi "interrot" install.log; then
            echo "::error::nessuna traccia dell'interruzione nel log (vedi sopra): il processo è stato ucciso prima di annullare, o non ha mai ricevuto il segnale"
            exit 1
          fi

          fallito=0
          check() { # descrizione, comando che deve FALLIRE
            if eval "$2" >/dev/null 2>&1; then
              echo "::error::$1"; fallito=1
            else
              echo "  ✔ $1"
            fi
          }
          check "l'utente odoo non è rimasto"        "id odoo"
          check "/opt/odoo non è rimasta"            "test -d /opt/odoo"
          check "l'unit systemd non è rimasta"       "test -f /etc/systemd/system/odoo18.service"

          # Il database si verifica SOLO se PostgreSQL risponde. Se il rollback
          # l'ha rifermato — perché l'avevamo avviato noi — un `psql` che
          # fallisce non dimostra che il database non c'è: dimostra che non
          # possiamo saperlo. Dichiararlo è meglio di un ✔ che non ha guardato.
          if sudo -u postgres psql -tAc 'select 1' >/dev/null 2>&1; then
            check "il database citest non è rimasto" \
              "sudo -u postgres psql -tAc \"select 1 from pg_database where datname='citest'\" | grep -q 1"
            check "il ruolo odoo non è rimasto" \
              "sudo -u postgres psql -tAc \"select 1 from pg_roles where rolname='odoo'\" | grep -q 1"
          else
            echo "  · PostgreSQL non raggiungibile (rifermato dal rollback): verifiche su DB/ruolo non eseguite"
          fi

          [ "$fallito" -eq 0 ] || exit 1
          echo "✔ un Ctrl-C reale ha prodotto un sistema pulito, senza intervento manuale"

      - name: Log dell'installer, se presente
        if: always()
        run: sudo cp /var/log/invok.log installer-interrupt.log || true

      - name: Carica il log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-interrupt
          path: |
            installer-*.log
            install.log
          if-no-files-found: ignore
