[package]
name = "invok"
# 3.0.0: renaming the crate, the binary and the packages changes the NAME of the
# artifacts (`invok_3.0.0-1_amd64.deb`), and for this project that name is part
# of the contract with whoever installs — the README spells them out in full.
# A change like that does not belong in a minor.
version = "3.0.0"
edition = "2021"
# "Odoo" stays in the text: it is nominative use, it says what the program
# installs, and it is what makes the crate findable. Out of the NAME, inside the
# description — exactly the distinction the rename rests on.
description = "Installer for Odoo — independent CLI installer (not affiliated with Odoo S.A.)"
license = "MIT"
repository = "https://github.com/Omisen/invok"
homepage = "https://github.com/Omisen/invok"
# `readme` is not decorative: without it the crates.io page shows only the
# one-line `description`, and someone arriving from `cargo search` sees neither
# the rollback nor the supported distributions.
readme = "README.md"
# Registry constraints, enforced by crates.io and NOT by cargo: at most 5
# keywords, each <= 20 characters, first character alphanumeric. A violation is
# invisible locally — it shows up when `cargo publish` rejects it, i.e. after the
# tag, which is the worst possible moment. Hence a test that counts and measures
# them beforehand.
keywords = ["odoo", "installer", "cli", "devops", "rollback"]
# From the CLOSED list at https://crates.io/categories: an invented value is
# rejected at publish time.
categories = ["command-line-utilities"]

# Metadata for `cargo deb`: produces a .deb that drops ONLY the `invok` CLI
# binary into /usr/bin (plus the docs). The package installs no services, creates
# no users, touches neither PostgreSQL nor Nginx — the installer does all that at
# runtime on the target when the user runs it. Hence no `systemd-units` and no
# `depends` on postgresql/nginx/python. `depends = "$auto"` covers only the
# binary's linking dependencies (for the static musl target: essentially none).
[package.metadata.deb]
maintainer = "Omisen"
copyright = "2026, Omisen"
license-file = ["LICENSE", "0"]
extended-description = """\
Installer for Odoo (16/17/18/19) on Ubuntu, Debian and Fedora, with \
transactional rollback. \
It sets up the system user, dependencies, PostgreSQL, the Odoo sources, a \
virtualenv, systemd and optionally Nginx; on failure it cleanly undoes its own \
work. \
The package installs only the command-line tool: Odoo itself is installed at \
runtime, when the user runs `invok`. \
Independent project: not affiliated with Odoo S.A., nor endorsed by it. "Odoo" \
is a trademark of Odoo S.A. This package neither contains nor redistributes \
any Odoo code."""
section = "admin"
priority = "optional"
depends = "$auto"
# The package revision, DECLARED and not inherited (A-V3-17).
#
# `cargo deb` adds one anyway — the file is called `invok_3.0.0-1_amd64.deb`,
# with the `-1` — but the value came from a tool default, i.e. from outside. The
# README names that file in full, so the name is part of the contract: a change
# in `cargo-deb`'s default would change the artifact name with nothing in the
# repository saying so, and the README command would 404. That is how A-V3-17
# happened, in reverse. Written here, the revision is a value tests can read.
revision = "1"
# The packaged doc is `PACKAGE-README`, NOT `README.md`, and the two are
# different documents rather than two renderings of one.
#
# The file is copied verbatim: nothing renders it, so whoever runs
# `less /usr/share/doc/invok/README` reads the raw text. Markdown survives
# that; HTML does not, which would put the repository README's presentation
# and this file's legibility in direct conflict.
#
# The deeper reason is the ten version-pinned strings — download URLs and full
# filenames — that live in README.md's install section, guarded by
# `tests/ci_config.rs` and by `release.yml`. A second copy of that section
# would carry those strings with no guard on them, and would fail SILENTLY: the
# named file still exists from an older release, so the customer installs the
# wrong version and nothing says so. That is A-V3-17 exactly.
#
# A README inside an already-installed package has no business explaining how
# to install it, so the packaged file simply has no install section — and
# therefore nothing to keep in step. What IS duplicated is the non-affiliation
# disclaimer, which must appear on every face of the package, and
# `every_package_face_disclaims_affiliation_with_odoo` checks all four.
assets = [
    ["target/release/invok", "usr/bin/", "755"],
    ["PACKAGE-README", "usr/share/doc/invok/README", "644"],
]
# The short `vok` alias is a SYMLINK created by the maintainer scripts, not a
# second binary: two identical executables in /usr/bin would be 8 MB wasted and
# two things that can diverge. The scripts live in `debian/` and are shared in
# intent — not as files — with the `.rpm` scriptlets below.
maintainer-scripts = "debian/"

# Metadata for `cargo generate-rpm`: the rpm counterpart of the block above, with
# the same promise — the package drops ONLY the CLI binary, installs no services,
# creates no users. There are no `requires` because the binary is static musl and
# depends on nothing from the system.
#
# `assets` does not inherit from `[package.metadata.deb]`: the two tools do not
# talk to each other and the paths have to be written twice. A test compares
# them, because two lists that must agree with nobody checking is how one ends up
# publishing an `.rpm` that does not contain the binary.
[package.metadata.generate-rpm]
# The non-affiliation disclaimer lives INSIDE the summary rather than next to it,
# because `cargo-generate-rpm` has no long-description field: `summary` is the
# only text we control, and it is what `dnf info` and `dnf search` show. On the
# `.deb` the same sentence lives in `extended-description`, which is the right
# place there. Two wordings, one promise — change one, change both.
summary = "Odoo installer with surgical rollback (Ubuntu/Debian/Fedora) — independent project, not affiliated with Odoo S.A."
# Like `revision` for the `.deb`, and for the same reason: the `-1` in
# `invok-3.0.0-1.x86_64.rpm` is in the README, so it cannot depend on an external
# tool's default (A-V3-17).
release = "1"
assets = [
    { source = "target/release/invok", dest = "/usr/bin/invok", mode = "755" },
    { source = "PACKAGE-README", dest = "/usr/share/doc/invok/README", mode = "644" },
]
# The `vok` alias, rpm counterpart of the deb block's `maintainer-scripts`.
#
# Two cautions, both from the same family as the installer's own protections —
# we do not destroy what is not ours:
#   - the link is created only if `/usr/bin/vok` is absent or already a symlink;
#     if someone put a real file there, we warn and give up;
#   - it is removed only if it still points at `invok`, and only on a REAL
#     uninstall (`$1 = 0`): during an upgrade rpm still runs the outgoing
#     version's postun, and deleting there would leave the user without the alias.
#
# The two scriptlets live in FILES, not as strings in here: the logic is the same
# as `debian/postinst` and `debian/postrm`, and two copies in two different
# formats — one in `debian/`, one inside a TOML manifest — diverge with nothing
# saying so. As files, a test can compare them.
#
# CAREFUL: these fields accept *either* an inline script *or* a path, and what
# tells them apart is whether the file exists. A wrong path is not an error: it
# becomes a scriptlet containing the literal string `rpm/post.sh`, i.e. a command
# that does not exist on the customer's system. A test demands that both files
# really exist, because it is a defect that would not show until a real install.
post_install_script = "rpm/post.sh"
post_uninstall_script = "rpm/postun.sh"

[lib]
name = "invok"
path = "src/lib.rs"

[[bin]]
name = "invok"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# POSIX calls behind a typed API — today the `flock` of the lock file.
nix = { version = "0.29", features = ["user", "fs", "signal"] }
# Signal handling (B-V3-5), with a **safe** API: the crate encapsulates the
# async-signal-safe part, which by hand would require `unsafe` — and in a program
# running as root that is worth avoiding. Zero real cost: it was already in the
# tree as a transitive dependency of `crossterm` (via `inquire`).
signal-hook = "0.3"
# SHA-256 checksum verification of downloads (gap G3).
sha2 = "0.10"
# Interactive UI, behind the prompt.rs / progress.rs boundary.
inquire = "0.7"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
