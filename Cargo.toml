[package]
name = "invok"
# 3.0.0: il rename di crate, binario e pacchetti cambia il NOME degli artefatti
# (`invok_3.0.0-1_amd64.deb`), che per questo progetto è parte del contratto con
# chi installa — il README li nomina per intero. Un cambio del genere non sta in
# una minor.
version = "3.0.0"
edition = "2021"
# «Odoo» resta nel testo: è uso nominativo, serve a dire cosa installa il
# programma ed è ciò che lo rende trovabile. Fuori dal NOME, dentro la
# descrizione — è esattamente la distinzione su cui poggia il rename.
description = "Installer for Odoo — independent CLI installer (not affiliated with Odoo S.A.)"
license = "MIT"
repository = "https://github.com/Omisen/invok"
homepage = "https://github.com/Omisen/invok"

# Metadati per `cargo deb`: producono un .deb che deposita SOLO il binario CLI
# `invok` in /usr/bin (+ la doc). Il pacchetto NON installa servizi, NON
# crea utenti, NON tocca PostgreSQL/Nginx: quelle cose le crea l'installer a
# runtime sul target quando l'utente lo lancia. Perciò niente `systemd-units` e
# niente `depends` su postgresql/nginx/python — sono compito del binario, non del
# pacchetto. `depends = "$auto"` copre le sole dipendenze di linking del binario
# (per il target musl statico: pressoché nessuna).
[package.metadata.deb]
maintainer = "Omisen"
copyright = "2026, Omisen"
license-file = ["LICENSE", "0"]
extended-description = """\
Installer per Odoo (16/17/18/19) su Ubuntu, Debian e Fedora, con rollback \
transazionale. \
Configura utente di sistema, dipendenze, PostgreSQL, sorgenti Odoo, virtualenv, \
systemd e Nginx opzionale; annulla in modo pulito in caso di errore. \
Il pacchetto installa solo il tool a riga di comando: l'installazione di Odoo \
avviene a runtime quando l'utente esegue `invok`. \
Progetto indipendente: non affiliato a Odoo S.A. né sostenuto da essa. «Odoo» è \
un marchio di Odoo S.A. Questo pacchetto non contiene né redistribuisce codice \
Odoo."""
section = "admin"
priority = "optional"
depends = "$auto"
# La revisione del pacchetto, DICHIARATA e non ereditata (A-V3-17).
#
# `cargo deb` la mette comunque — il file si chiama `invok_2.4.0-1_amd64.deb`,
# col `-1` — ma il valore veniva da un default dello strumento, cioè da fuori.
# Il README nomina quel file per intero, quindi il nome è parte del contratto con
# chi installa: un default che cambia versione di `cargo-deb` cambierebbe il nome
# dell'artefatto senza che nulla nel repository lo dica, e il comando del README
# diventerebbe un 404 — che è esattamente com'è nato A-V3-17, al contrario.
# Scritta qui, la revisione è un dato che i test possono leggere e confrontare.
revision = "1"
assets = [
    ["target/release/invok", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/invok/README", "644"],
]
# L'alias breve `vok` è un SYMLINK creato dai maintainer script, non un secondo
# binario: due eseguibili identici in /usr/bin sarebbero 8 MB sprecati e due cose
# che possono divergere. Gli script vivono in `debian/` e sono condivisi come
# intento — non come file — con gli scriptlet del `.rpm` più sotto.
maintainer-scripts = "debian/"

# Metadati per `cargo generate-rpm`: la controparte rpm del blocco sopra, con la
# stessa promessa — il pacchetto deposita SOLO il binario CLI, non installa
# servizi, non crea utenti, non tocca PostgreSQL/nginx. Quelle cose le fa
# l'installer a runtime, ed è la ragione per cui non ci sono `requires`: il
# binario è musl statico e non dipende da nulla del sistema.
#
# `assets` non eredita da `[package.metadata.deb]`: i due strumenti non si
# parlano, e i percorsi vanno scritti due volte. C'è un test che li confronta,
# perché due liste che devono coincidere e nessuno che lo verifichi è il modo
# in cui si finisce per pubblicare un `.rpm` che non contiene il binario.
[package.metadata.generate-rpm]
# Il disclaimer di non affiliazione sta DENTRO il summary, e non accanto, perché
# `cargo-generate-rpm` non ha un campo di descrizione lunga: `summary` è l'unico
# testo che possiamo scrivere noi, ed è quello che `dnf info` e `dnf search`
# mostrano. Sul `.deb` la stessa frase vive in `extended-description`, che è il
# posto giusto lì. Due formulazioni, stessa promessa — se una delle due cambia,
# vanno cambiate entrambe.
summary = "Installer Odoo con rollback chirurgico (Ubuntu/Debian/Fedora) — progetto indipendente, non affiliato a Odoo S.A."
# Come `revision` per il `.deb`, e per lo stesso motivo: il `-1` di
# `invok-2.4.0-1.x86_64.rpm` è nel README, quindi non può dipendere dal
# default di uno strumento esterno (A-V3-17).
release = "1"
assets = [
    { source = "target/release/invok", dest = "/usr/bin/invok", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/invok/README", mode = "644" },
]
# L'alias `vok`, controparte rpm di `maintainer-scripts` del blocco deb.
#
# Due cautele, entrambe della stessa famiglia delle protezioni dell'installer —
# non si distrugge ciò che non è nostro:
#   - si crea il link solo se `/usr/bin/vok` non esiste o è già un symlink; se
#     qualcuno ci ha messo un file vero, si avvisa e si rinuncia;
#   - si rimuove solo se punta ancora a `invok`, e solo alla disinstallazione
#     VERA (`$1 = 0`): durante un aggiornamento rpm esegue comunque il postun
#     della versione uscente, e cancellare lì lascerebbe l'utente senza alias.
#
# I due scriptlet stanno in FILE, non come stringhe qui dentro: la logica è la
# stessa di `debian/postinst` e `debian/postrm`, e due copie in due formati
# diversi — una in `debian/`, una dentro un manifesto TOML — divergono senza che
# nulla lo dica. In file, un test le confronta.
#
# ATTENZIONE: questi campi accettano *o* uno script inline *o* un percorso, e la
# distinzione la fa l'esistenza del file. Un percorso sbagliato non è un errore:
# diventa uno scriptlet che contiene la stringa `rpm/post.sh`, cioè un comando
# che sul sistema del cliente non esiste. C'è un test che pretende che questi
# due file esistano davvero, perché è un difetto che non si vedrebbe fino
# all'installazione su una macchina vera.
post_install_script = "rpm/post.sh"
post_uninstall_script = "rpm/postun.sh"

[lib]
name = "invok"
path = "src/lib.rs"

[[bin]]
name = "invok"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Non ancora usato in Fase 0: riservato per chiamate POSIX tipizzate (uid/gid,
# permessi) nelle fasi successive con gli step di sistema reali.
nix = { version = "0.29", features = ["user", "fs"] }
# Gestione dei segnali (B-V3-5), con API **safe**: il crate incapsula la parte
# async-signal-safe, che a mano richiederebbe `unsafe` — in un programma che
# gira come root si evita quando si puo'. Costo reale zero: era gia' nell'albero
# come dipendenza transitiva di `crossterm` (via `inquire`).
signal-hook = "0.3"
# Verifica checksum SHA-256 dei download (gap G3).
sha2 = "0.10"
# UI interattiva (Fase 11), dietro il confine prompt.rs / progress.rs.
inquire = "0.7"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
