[package]
name = "odoo-installer"
version = "0.1.0"
edition = "2021"
description = "Installer Odoo con rollback chirurgico (port Rust)"
license = "MIT"

[lib]
name = "odoo_installer"
path = "src/lib.rs"

[[bin]]
name = "odoo-installer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Non ancora usato in Fase 0: riservato per chiamate POSIX tipizzate (uid/gid,
# permessi) nelle fasi successive con gli step di sistema reali.
nix = { version = "0.29", features = ["user", "fs"] }
# Verifica checksum SHA-256 dei download (gap G3).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
